<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 2 Flashcards: Cells &amp; Organelles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBFAF7;
    --grid-line: rgba(28,43,74,0.055);
    --ink: #1C2B4A;
    --text: #2B3648;
    --text-soft: #64707F;
    --blue: #2E86AB;
    --blue-soft: #E9F3F8;
    --amber: #D98A2B;
    --amber-soft: #FCF1DE;
    --coral: #D65A5A;
    --coral-soft: #FBEBEB;
    --teal: #2C9C82;
    --teal-soft: #E6F5F0;
    --violet: #7C5CBF;
    --violet-soft: #EFE9F8;
    --card-bg: #FFFFFF;
    --border: #E4E0D4;
    --gray: #94A0AD;
    --gray-line: #CBD3DC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  h1, h2, h3, .display { font-family: 'Space Grotesk', sans-serif; color: var(--ink); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
  a { color: inherit; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-soft); text-decoration: none; font-size: 0.88rem; font-weight: 600; margin-bottom: 18px; }
  .back-link:hover { color: var(--blue); }

  /* ---------- Hero ---------- */
  .hero {
    background: var(--ink);
    border-radius: 18px;
    padding: 26px 28px;
    color: #fff;
    margin-bottom: 22px;
  }
  .hero h1 { color: #fff; font-size: 1.7rem; margin: 0 0 6px; line-height: 1.15; }
  .hero p { margin: 0; color: #C8D3E0; font-size: 0.96rem; max-width: 52ch; }

  /* ---------- Category tabs ---------- */
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 20px; }
  .tab-btn {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 0.84rem;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-soft);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tab-btn:hover { border-color: var(--ink); color: var(--ink); }
  .tab-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* ---------- Progress / stats ---------- */
  .statline {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.82rem; color: var(--text-soft); margin-bottom: 10px; flex-wrap: wrap; gap: 6px;
  }
  .statline b { color: var(--ink); }
  .progress-track { height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; margin-bottom: 18px; }
  .progress-fill { height: 100%; background: var(--blue); border-radius: 999px; transition: width 0.2s ease; }

  /* ---------- Flashcard ---------- */
  .stage { perspective: 1600px; margin-bottom: 18px; }
  .flashcard {
    position: relative;
    min-height: 420px;
    border-radius: 18px;
    cursor: pointer;
    transition: transform 0.5s cubic-bezier(.4,.2,.2,1);
    transform-style: preserve-3d;
  }
  .flashcard.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    box-shadow: 0 4px 18px rgba(28,43,74,0.07);
    padding: 26px 28px;
    display: flex; flex-direction: column;
  }
  .face.back { transform: rotateY(180deg); overflow-y: auto; }
  .cat-tag {
    display: inline-flex; align-self: flex-start;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 0.72rem;
    letter-spacing: 0.02em; text-transform: uppercase;
    padding: 4px 11px; border-radius: 999px; margin-bottom: 14px;
  }
  .face.front { align-items: center; text-align: center; justify-content: center; }
  .term { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--ink); font-size: 1.45rem; line-height: 1.25; margin: 0; }
  .flip-hint { margin-top: 18px; font-size: 0.8rem; color: var(--gray); }
  .def { font-size: 0.98rem; font-weight: 600; color: var(--ink); line-height: 1.42; margin: 0 0 10px; }
  .extra { font-size: 0.86rem; color: var(--text-soft); line-height: 1.45; margin: 0 0 14px; }
  .diagram-wrap { margin-top: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 6px; }
  .diagram-wrap svg { display: block; width: 100%; height: auto; }

  /* ---------- Controls ---------- */
  .controls { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .btn {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.88rem;
    border: 1px solid var(--border); background: var(--card-bg); color: var(--ink);
    border-radius: 10px; padding: 10px 16px; cursor: pointer; transition: all 0.15s ease;
  }
  .btn:hover { border-color: var(--ink); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.primary:hover { opacity: 0.9; }
  .rate-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 6px; }
  .btn.rate-bad { border-color: var(--coral); color: var(--coral); }
  .btn.rate-bad:hover { background: var(--coral-soft); }
  .btn.rate-good { border-color: var(--teal); color: var(--teal); }
  .btn.rate-good:hover { background: var(--teal-soft); }

  .tally { text-align: center; font-size: 0.82rem; color: var(--text-soft); margin-top: 4px; }
  .tally b.good { color: var(--teal); }
  .tally b.bad { color: var(--coral); }

  @media (max-width: 480px) {
    .flashcard { min-height: 460px; }
    .term { font-size: 1.2rem; }
  }
</style>
</head>

<div class="wrap">
  <a class="back-link" href="biology.html">&larr; Back to Biology</a>
  <div class="hero">

      <div class="face back">

  <div class="controls">

    <button class="btn" id="btnNext">Next &rarr;</button>
  </div>

  <p class="tally" id="tally"></p>
</div>

<script>
/* ============ Diagram helpers ============ */
function svg(inner, vb, h) {
  return '<svg viewBox="'+vb+'" width="100%" height="'+(h||180)+'" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg>';
}
function lineEl(x1,y1,x2,y2,color,w,dash){ return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(color||'var(--ink)')+'" stroke-width="'+(w||2.5)+'" stroke-linecap="round"'+(dash?' stroke-dasharray="5 4"':'')+'/>'; }
function dot(x,y,color,r){ return '<circle cx="'+x+'" cy="'+y+'" r="'+(r||3.2)+'" fill="'+(color||'var(--ink)')+'"/>'; }
function txt(x,y,s,color,size,weight,anchor){ return '<text x="'+x+'" y="'+y+'" fill="'+(color||'var(--ink)')+'" font-family="Space Grotesk, sans-serif" font-size="'+(size||13)+'" font-weight="'+(weight||700)+'" text-anchor="'+(anchor||'middle')+'">'+s+'</text>'; }
function poly(pts,color,w,fill){ return '<polygon points="'+pts+'" fill="'+(fill||'none')+'" stroke="'+(color||'var(--ink)')+'" stroke-width="'+(w||2.5)+'" stroke-linejoin="round"/>'; }
function ellipseEl(cx,cy,rx,ry,fill,stroke,w){ return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'var(--ink)')+'" stroke-width="'+(w||2.5)+'"/>'; }
function circleEl(cx,cy,r,fill,stroke,w){ return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'var(--ink)')+'" stroke-width="'+(w||2.5)+'"/>'; }
function rectEl(x,y,w,h,rx,fill,stroke,sw){ return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(rx||0)+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'var(--ink)')+'" stroke-width="'+(sw||2.5)+'"/>'; }
function pathEl(d,stroke,w,fill,dash){ return '<path d="'+d+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'var(--ink)')+'" stroke-width="'+(w||2.5)+'" stroke-linecap="round"'+(dash?' stroke-dasharray="4 3"':'')+'/>'; }
/* gentle sine-wave line between two points — used for ER membranes, mRNA strands, flagella */
function wavy(x1,y1,x2,y2,amp,cycles,color,w){
  var n=28, pts=[];
  var dx=x2-x1, dy=y2-y1, len=Math.sqrt(dx*dx+dy*dy)||1;
  var ux=dx/len, uy=dy/len, px=-uy, py=ux;
  for(var i=0;i<=n;i++){
    var t=i/n;
    var bx=x1+dx*t, by=y1+dy*t;
    var off=Math.sin(t*Math.PI*2*cycles)*amp;
    pts.push((bx+px*off).toFixed(1)+','+(by+py*off).toFixed(1));
  }
  return '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+(color||'var(--ink)')+'" stroke-width="'+(w||2.2)+'" stroke-linecap="round"/>';
}

/* ============ Biology diagrams ============ */

/* --- Generic eukaryotic cell cross-section --- */
function diagEukaryoticCell(){
  var inner =
      ellipseEl(190,130,175,108,'none','var(--ink)',3)
    + ellipseEl(112,86,50,40,'var(--blue-soft)','var(--blue)',2.5)
    + dot(112,86,'var(--blue)',7)
    + txt(112,66,'nucleolus','var(--ink)',7.5,600)
    + txt(112,140,'Nucleus','var(--blue)',11,700)
    + wavy(166,52,262,48,7,3,'var(--coral)',2)
    + dot(184,48,'var(--coral)',2.2) + dot(204,56,'var(--coral)',2.2) + dot(224,46,'var(--coral)',2.2) + dot(244,54,'var(--coral)',2.2)
    + txt(214,36,'Rough ER','var(--coral)',10,700)
    + wavy(190,180,282,170,6,2.5,'var(--amber)',2)
    + txt(236,200,'Smooth ER','var(--amber)',10,700)
    + pathEl('M60,190 Q95,178 130,190','var(--teal)',3)
    + pathEl('M56,202 Q95,190 134,202','var(--teal)',3)
    + pathEl('M52,214 Q95,202 138,214','var(--teal)',3)
    + txt(95,232,'Golgi Apparatus','var(--teal)',10,700)
    + ellipseEl(305,115,26,16,'var(--coral-soft)','var(--coral)',2.5)
    + lineEl(293,115,301,108,'var(--coral)',1.6)
    + lineEl(297,121,309,112,'var(--coral)',1.6)
    + txt(305,143,'Mitochondrion','var(--coral)',9.5,700)
    + dot(58,148,'var(--ink)',3) + dot(330,178,'var(--ink)',3) + dot(78,220,'var(--ink)',3)
    + txt(58,163,'ribosomes','var(--text-soft)',8,600)
    + circleEl(328,140,19,'none','var(--violet)',2.2)
    + txt(328,168,'vacuole','var(--violet)',8.5,600)
    + circleEl(238,222,10,'var(--amber-soft)','var(--amber)',2)
    + txt(238,238,'lysosome','var(--amber)',8,600)
    + txt(50,72,'cytoplasm','var(--text-soft)',9,500)
    + txt(190,250,'cell membrane','var(--text-soft)',9,600);
  return svg(inner,'0 0 380 262',225);
}

/* --- Simple prokaryotic cell (rod shape) + shape gallery --- */
function diagProkaryoticCell(){
  var inner =
      rectEl(30,25,220,95,45,'none','var(--ink)',3)
    + rectEl(42,37,196,71,32,'none','var(--blue)',1.8)
    + pathEl('M105,72 C105,58 122,54 132,63 C142,72 160,68 160,82 C160,96 142,100 132,91 C122,82 105,86 105,72 Z','var(--teal)',2.2)
    + txt(140,18,'Cell Wall','var(--ink)',10,700)
    + txt(140,131,'Cell Membrane','var(--blue)',9,600)
    + txt(133,113,'nucleoid (single DNA loop)','var(--teal)',7.8,600)
    + dot(55,45,'var(--ink)',2.2) + dot(70,92,'var(--ink)',2.2) + dot(188,50,'var(--ink)',2.2) + dot(198,96,'var(--ink)',2.2) + dot(60,66,'var(--ink)',2.2) + dot(208,76,'var(--ink)',2.2)
    + txt(58,32,'ribosomes','var(--text-soft)',7.5,600)
    + rectEl(28,166,58,26,13,'none','var(--ink)',2.2)
    + txt(57,206,'rod / bacilli','var(--text-soft)',8,600)
    + circleEl(152,179,17,'none','var(--ink)',2.2)
    + txt(152,206,'circular / cocci','var(--text-soft)',8,600)
    + wavy(222,179,290,179,10,2,'var(--ink)',2.2)
    + txt(256,206,'spiral / spirilla','var(--text-soft)',8,600);
  return svg(inner,'0 0 320 220',195);
}

/* --- Endosymbiosis: two engulfment events --- */
function diagEndosymbiosis(){
  var inner =
      ellipseEl(95,112,72,60,'var(--blue-soft)','var(--ink)',2.5)
    + circleEl(146,84,15,'var(--coral-soft)','var(--coral)',2)
    + pathEl('M130,71 A20,20 0 0 1 161,97','var(--coral)',1.6,undefined,true)
    + txt(95,188,'Step 1: host cell engulfs an','var(--text-soft)',9,600)
    + txt(95,200,'α-proteobacterium','var(--text-soft)',9,600)
    + txt(95,214,'→ becomes the mitochondrion','var(--coral)',9,700)
    + lineEl(182,112,218,112,'var(--ink)',2.5)
    + poly('218,105 232,112 218,119','var(--ink)',2,'var(--ink)')
    + ellipseEl(303,112,80,66,'var(--blue-soft)','var(--ink)',2.5)
    + ellipseEl(282,96,16,10,'var(--coral-soft)','var(--coral)',2)
    + circleEl(338,86,17,'var(--teal-soft)','var(--teal)',2)
    + pathEl('M321,72 A22,22 0 0 1 355,100','var(--teal)',1.6,undefined,true)
    + txt(303,188,'Step 2: that cell engulfs a','var(--text-soft)',9,600)
    + txt(303,200,'cyanobacterium','var(--text-soft)',9,600)
    + txt(303,214,'→ becomes the chloroplast','var(--teal)',9,700);
  return svg(inner,'0 0 400 226',195);
}

/* --- Phospholipid bilayer cross-section --- */
function diagGolgi(){
  var inner =
      pathEl('M50,178 Q130,163 210,178','var(--teal)',3)
    + pathEl('M45,155 Q130,141 215,155','var(--teal)',3)
    + pathEl('M42,132 Q130,119 218,132','var(--teal)',3)
    + pathEl('M45,109 Q130,97 215,109','var(--teal)',3)
    + pathEl('M52,87 Q130,76 208,87','var(--teal)',3)
    + dot(50,178,'var(--teal)',3) + dot(210,178,'var(--teal)',3)
    + dot(52,87,'var(--teal)',3) + dot(208,87,'var(--teal)',3)
    + txt(130,199,'cis face (receiving from ER)','var(--text-soft)',9,600)
    + txt(130,60,'trans face (shipping out)','var(--text-soft)',9,600);
  return svg(inner,'0 0 260 212',180);
}

/* --- Ribosome: large + small subunit with mRNA threading through --- */
function diagRibosome(){
  var inner =
      ellipseEl(130,104,72,36,'var(--blue-soft)','var(--blue)',2.5)
    + ellipseEl(130,64,46,24,'var(--teal-soft)','var(--teal)',2.5)
    + wavy(6,86,254,86,6,4,'var(--coral)',2.4)
    + txt(130,152,'Large subunit','var(--blue)',10,700)
    + txt(130,38,'Small subunit','var(--teal)',10,700)
    + txt(226,102,'mRNA','var(--coral)',9.5,700);
  return svg(inner,'0 0 260 168',150);
}

/* --- Plant vs. animal cell, highlighting plant-only parts --- */
function diagPlantVsAnimal(){
  var inner =
      circleEl(85,102,72,'none','var(--ink)',2.5)
    + circleEl(65,84,19,'var(--blue-soft)','var(--blue)',2)
    + ellipseEl(108,128,15,9,'var(--coral-soft)','var(--coral)',2)
    + txt(85,192,'Animal Cell','var(--ink)',11,700)
    + txt(65,108,'nucleus','var(--text-soft)',7,600)
    + rectEl(188,28,150,148,22,'none','var(--teal)',4)
    + rectEl(200,40,126,124,16,'none','var(--ink)',2)
    + circleEl(224,64,16,'var(--blue-soft)','var(--blue)',2)
    + circleEl(263,102,50,'var(--violet-soft)','var(--violet)',2.2)
    + ellipseEl(305,58,13,8,'var(--teal-soft)','var(--teal)',2)
    + ellipseEl(300,146,13,8,'var(--teal-soft)','var(--teal)',2)
    + txt(263,194,'Plant Cell','var(--ink)',11,700)
    + txt(224,88,'nucleus','var(--text-soft)',7,600)
    + txt(263,102,'central','var(--violet)',7.6,700)
    + txt(263,113,'vacuole','var(--violet)',7.6,700)
    + txt(305,46,'chloroplast','var(--teal)',7.4,700)
    + txt(300,134,'chloroplast','var(--teal)',7.4,700)
    + txt(263,18,'cell wall (plant only)','var(--teal)',9,700);
  return svg(inner,'0 0 350 202',175);
}

/* ============ Card data ============ */

/* ============ 2.3 Cell Membrane diagrams (original, same helper library) ============ */
function diagPhospholipid(){
  var inner =
      circleEl(80,50,30,'var(--blue-soft)','var(--blue)',2.5)
    + txt(80,46,'phosphate','var(--blue)',9,700)
    + txt(80,58,'+ glycerol','var(--blue)',9,700)
    + lineEl(68,80,68,178,'var(--ink)',3)
    + pathEl('M92,80 L92,118 L106,132 L106,178','var(--ink)',3)
    + txt(215,44,'Polar head','var(--blue)',12,700,'start') + txt(215,60,'hydrophilic (water-loving)','var(--text-soft)',10,600,'start')
    + lineEl(112,50,208,50,'var(--blue)',1.5,true)
    + txt(215,126,'Nonpolar tails','var(--ink)',12,700,'start') + txt(215,142,'2 fatty acids — hydrophobic','var(--text-soft)',10,600,'start')
    + lineEl(112,132,208,132,'var(--ink)',1.5,true)
    + txt(50,196,'saturated','var(--text-soft)',9,600) + txt(116,196,'unsaturated (kink)','var(--text-soft)',9,600);
  return svg(inner,'0 0 400 206',200);
}

function diagPhospholipidBilayer(){
  var xs=[30,72,114,156,198,240,282];
  var inner='';
  inner += rectEl(0,40,312,100,0,'var(--amber-soft)','none',0);
  for(var i=0;i<xs.length;i++){
    var x=xs[i];
    inner += circleEl(x,26,11,'var(--blue-soft)','var(--blue)',2);
    inner += lineEl(x-4,37,x-4,72,'var(--ink)',2.2) + lineEl(x+4,37,x+4,72,'var(--ink)',2.2);
    inner += lineEl(x-4,108,x-4,143,'var(--ink)',2.2) + lineEl(x+4,108,x+4,143,'var(--ink)',2.2);
    inner += circleEl(x,154,11,'var(--blue-soft)','var(--blue)',2);
  }
  inner += txt(156,10,'OUTSIDE (extracellular) — watery','var(--blue)',9.5,700);
  inner += txt(156,94,'hydrophobic core: tails face inward','var(--amber)',9.5,700);
  inner += txt(156,182,'INSIDE (cytoplasm) — watery','var(--blue)',9.5,700);
  return svg(inner,'0 0 312 190',170);
}

function diagMembraneParts(){
  var inner='', xs=[];
  for(var x=20;x<=400;x+=22) xs.push(x);
  inner += rectEl(0,70,420,60,0,'var(--amber-soft)','none',0);
  for(var i=0;i<xs.length;i++){
    var x=xs[i];
    if((x>100&&x<170)||(x>250&&x<300)) continue;
    inner += circleEl(x,62,8,'var(--blue-soft)','var(--blue)',1.6) + circleEl(x,138,8,'var(--blue-soft)','var(--blue)',1.6);
  }
  // integral, spans membrane
  inner += rectEl(106,36,58,128,22,'var(--coral-soft)','var(--coral)',2.5);
  inner += txt(135,186,'integral (spans)','var(--coral)',9.5,700);
  // integral, partway
  inner += rectEl(252,42,46,62,18,'var(--coral-soft)','var(--coral)',2.5);
  inner += txt(275,186,'integral (partway)','var(--coral)',9.5,700);
  // peripheral
  inner += ellipseEl(350,160,26,12,'var(--violet-soft)','var(--violet)',2.2);
  inner += txt(350,186,'peripheral','var(--violet)',9.5,700);
  // glycoprotein chain

function buildTabs(){

    activeCat = e.target.dataset.key;
    Array.prototype.forEach.call(tabsEl.children, function(b){ b.classList.toggle('active', b.dataset.key===activeCat); });
    document.getElementById('filterLabel').textContent = activeCat==='all' ? 'All cards' : catInfo(activeCat).label;
    pos = 0; flipped=false;
    renderCard();
  });
}

function renderCard(){
  var idxs = currentIndices();
  if(idxs.length===0) return;
  if(pos>=idxs.length) pos=0;
  var card = CARDS[idxs[pos]];
  var info = catInfo(card.cat);

  document.getElementById('flashcard').classList.remove('flipped');
  flipped=false;

  document.getElementById('catTagFront').textContent = info.label;
  document.getElementById('catTagFront').style.background = info.color;
  document.getElementById('catTagFront').style.color = '#fff';
  document.getElementById('catTagBack').textContent = info.label;
  document.getElementById('catTagBack').style.background = info.color;
  document.getElementById('catTagBack').style.color = '#fff';

  document.getElementById('termText').textContent = card.term;
  document.getElementById('defText').textContent = card.def;
  document.getElementById('extraText').textContent = card.extra || '';

  var dWrap = document.getElementById('diagramWrap');
  if(card.diagram){
    dWrap.style.display='block';
    dWrap.innerHTML = card.diagram();
  } else {
    dWrap.style.display='none';
    dWrap.innerHTML='';
  }

  document.getElementById('cardNum').textContent = pos+1;
  document.getElementById('cardTotal').textContent = idxs.length;
  document.getElementById('progressFill').style.width = Math.round(((pos+1)/idxs.length)*100)+'%';

  document.getElementById('rateRow').style.visibility='hidden';
  updateTally();
}

function updateTally(){
  var t = document.getElementById('tally');
  if(goodCount+badCount===0){ t.textContent=''; return; }
  t.innerHTML = '<b class="good">'+goodCount+'</b> got it &middot; <b class="bad">'+badCount+'</b> still learning';
}

function nextCard(){ var idxs=currentIndices(); pos=(pos+1)%idxs.length; renderCard(); }
function prevCard(){ var idxs=currentIndices(); pos=(pos-1+idxs.length)%idxs.length; renderCard(); }
function shuffleDeck(){
  for(var i=order.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=order[i]; order[i]=order[j]; order[j]=t; }
  pos=0; goodCount=0; badCount=0; seenRated={}; renderCard();
}

document.getElementById('flashcard').addEventListener('click', function(){
  flipped=!flipped;
  this.classList.toggle('flipped', flipped);
  document.getElementById('rateRow').style.visibility = flipped ? 'visible' : 'hidden';
});
document.getElementById('btnNext').addEventListener('click', function(e){ e.stopPropagation(); nextCard(); });
document.getElementById('btnPrev').addEventListener('click', function(e){ e.stopPropagation(); prevCard(); });
document.getElementById('btnShuffle').addEventListener('click', function(e){ e.stopPropagation(); shuffleDeck(); });
document.getElementById('btnGood').addEventListener('click', function(e){
  e.stopPropagation();
  var idxs=currentIndices(); var key=idxs[pos];
  if(seenRated[key]==='bad') badCount--; if(seenRated[key]!=='good'){ goodCount++; seenRated[key]='good'; }
  updateTally(); nextCard();
});
document.getElementById('btnBad').addEventListener('click', function(e){
  e.stopPropagation();
  var idxs=currentIndices(); var key=idxs[pos];
  if(seenRated[key]==='good') goodCount--; if(seenRated[key]!=='bad'){ badCount++; seenRated[key]='bad'; }
  updateTally(); nextCard();
});

buildTabs();
renderCard();
</script>
</body>
</html>
