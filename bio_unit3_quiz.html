<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 3 Quiz: Cell Energy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBFAF7;
    --grid-line: rgba(28,43,74,0.055);
    --ink: #1C2B4A;
    --text: #2B3648;
    --text-soft: #64707F;
    --blue: #2E86AB;
    --blue-soft: #E9F3F8;
    --amber: #D98A2B;
    --amber-soft: #FCF1DE;
    --coral: #D65A5A;
    --coral-soft: #FBEBEB;
    --teal: #2C9C82;
    --teal-soft: #E6F5F0;
    --violet: #7C5CBF;
    --violet-soft: #EFE9F8;
    --card-bg: #FFFFFF;
    --border: #E4E0D4;
    --gray: #94A0AD;
    --gray-line: #CBD3DC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; color: var(--ink); }
  .wrap { max-width: 680px; margin: 0 auto; padding: 32px 20px 80px; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-soft); text-decoration: none; font-size: 0.88rem; font-weight: 600; margin-bottom: 18px; }
  .back-link:hover { color: var(--blue); }

  .hero { background: var(--ink); border-radius: 18px; padding: 26px 28px; color: #fff; margin-bottom: 22px; }
  .hero h1 { color: #fff; font-size: 1.7rem; margin: 0 0 6px; }
  .hero p { margin: 0; color: #C8D3E0; font-size: 0.96rem; max-width: 52ch; }

  .statline { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--text-soft); margin-bottom: 8px; }
  .statline b { color: var(--ink); }
  .progress-track { height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; margin-bottom: 20px; }
  .progress-fill { height: 100%; background: var(--blue); border-radius: 999px; transition: width 0.25s ease; }

  .qcard {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px;
    padding: 26px 28px; box-shadow: 0 4px 18px rgba(28,43,74,0.06);
  }
  .qkicker { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 0.72rem; letter-spacing: 0.03em; text-transform: uppercase; color: var(--blue); margin: 0 0 8px; }
  .qtext { font-size: 1.1rem; font-weight: 700; color: var(--ink); line-height: 1.35; margin: 0 0 16px; }
  .diagram-wrap { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 6px; margin-bottom: 18px; }
  .diagram-wrap svg { display: block; width: 100%; height: auto; max-height: 270px; }

  .opt {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left; font-family: 'Inter', sans-serif; font-size: 0.96rem; font-weight: 600;
    color: var(--ink); background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 12px;
    padding: 12px 16px; margin-bottom: 10px; cursor: pointer; transition: all 0.15s ease;
  }
  .opt:hover:not(.locked) { border-color: var(--blue); background: var(--blue-soft); }
  .opt .letter {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 999px; border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 700; color: var(--text-soft);
  }
  .opt.correct { border-color: var(--teal); background: var(--teal-soft); }
  .opt.correct .letter { background: var(--teal); border-color: var(--teal); color: #fff; }
  .opt.incorrect { border-color: var(--coral); background: var(--coral-soft); }
  .opt.incorrect .letter { background: var(--coral); border-color: var(--coral); color: #fff; }
  .opt.locked { cursor: default; }
  .opt.dim { opacity: 0.55; }

  .explain {
    display: none; margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: var(--blue-soft); color: var(--ink); font-size: 0.9rem; line-height: 1.45;
  }
  .explain.show { display: block; }
  .explain b { color: var(--blue); }

  .qcontrols { display: flex; justify-content: flex-end; margin-top: 18px; }
  .btn {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.92rem;
    border: 1px solid var(--ink); background: var(--ink); color: #fff;
    border-radius: 10px; padding: 11px 20px; cursor: pointer; transition: opacity 0.15s ease;
  }
  .btn:hover { opacity: 0.88; }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn.ghost { background: var(--card-bg); color: var(--ink); }

  /* results screen */
  .results { text-align: center; }
  .score-big { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 3rem; color: var(--ink); margin: 6px 0; }
  .score-msg { font-size: 1rem; color: var(--text-soft); margin-bottom: 22px; }
  .missed-list { text-align: left; margin: 20px 0; padding: 0; list-style: none; }
  .missed-list li { padding: 10px 0; border-top: 1px solid var(--border); font-size: 0.88rem; color: var(--text-soft); }
  .missed-list li b { color: var(--ink); display: block; margin-bottom: 2px; }

  @media (max-width: 480px) {
    .qtext { font-size: 1.02rem; }
  }
  .sec-picker{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
  .sec-picker button{font:600 0.8rem Inter,sans-serif;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text-soft);padding:7px 11px;border-radius:999px;cursor:pointer}
  .sec-picker button.active{background:var(--ink);border-color:var(--ink);color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="biology.html">&larr; Back to Biology</a>
  <div class="hero">
    <h1>Unit 3 Quiz</h1>
    <p id="heroSub"></p>
  </div>
  <div class="sec-picker" id="secPicker"></div>
  <div id="quizArea">
    <div class="statline">
      <span>Question <b id="qNum">1</b> of <b id="qTotal">1</b></span>
      <span id="scoreLive">Score: 0</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="qcard">
      <p class="qkicker" id="qKicker"></p>
      <p class="qtext" id="qText"></p>
      <div class="diagram-wrap" id="diagramWrap" style="display:none;"></div>
      <div id="optsWrap"></div>
      <div class="explain" id="explain"></div>
      <div class="qcontrols"><button class="btn" id="btnNext" disabled>Next Question &rarr;</button></div>
    </div>
  </div>
  <div id="resultsArea" style="display:none;">
    <div class="qcard results">
      <p class="qkicker">Quiz complete</p>
      <div class="score-big" id="finalScore">0 / 0</div>
      <p class="score-msg" id="finalMsg"></p>
      <ul class="missed-list" id="missedList"></ul>
      <button class="btn" id="btnRetake">Retake Quiz</button>
    </div>
  </div>
</div>
<script>
function svg(inner, vb, h) { return '<svg viewBox="'+vb+'" width="100%" height="'+(h||180)+'" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg>'; }
function lineEl(x1,y1,x2,y2,color,w,dash){ return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(color||'var(--ink)')+'" stroke-width="'+(w||2.5)+'" stroke-linecap="round"'+(dash?' stroke-dasharray="5 4"':'')+'/>'; }
function dot(x,y,color,r){ return '<circle cx="'+x+'" cy="'+y+'" r="'+(r||3.2)+'" fill="'+(color||'var(--ink)')+'"/>'; }
function txt(x,y,s,color,size,weight,anchor){ return '<text x="'+x+'" y="'+y+'" fill="'+(color||'var(--ink)')+'" font-family="Space Grotesk, sans-serif" font-size="'+(size||13)+'" font-weight="'+(weight||700)+'" text-anchor="'+(anchor||'middle')+'">'+s+'</text>'; }
function poly(pts,color,w,fill){ return '<polygon points="'+pts+'" fill="'+(fill||'none')+'" stroke="'+(color||'var(--ink)')+'" stroke-width="'+(w||2.5)+'" stroke-linejoin="round"/>'; }
function ellipseEl(cx,cy,rx,ry,fill,stroke,w){ return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'var(--ink)')+'" stroke-width="'+(w||2.5)+'"/>'; }
function circleEl(cx,cy,r,fill,stroke,w){ return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'var(--ink)')+'" stroke-width="'+(w||2.5)+'"/>'; }
function rectEl(x,y,w,h,rx,fill,stroke,sw){ return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(rx||0)+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'var(--ink)')+'" stroke-width="'+(sw||2.5)+'"/>'; }
function pathEl(d,stroke,w,fill,dash){ return '<path d="'+d+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'var(--ink)')+'" stroke-width="'+(w||2.5)+'" stroke-linecap="round"'+(dash?' stroke-dasharray="4 3"':'')+'/>'; }
function wavy(x1,y1,x2,y2,amp,cycles,color,w){
  var n=28, pts=[];
  var dx=x2-x1, dy=y2-y1, len=Math.sqrt(dx*dx+dy*dy)||1;
  var ux=dx/len, uy=dy/len, px=-uy, py=ux;
  for(var i=0;i<=n;i++){
    var t=i/n;
    var bx=x1+dx*t, by=y1+dy*t;
    var off=Math.sin(t*Math.PI*2*cycles)*amp;
    pts.push((bx+px*off).toFixed(1)+','+(by+py*off).toFixed(1));
  }
  return '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+(color||'var(--ink)')+'" stroke-width="'+(w||2.2)+'" stroke-linecap="round"/>';
}
/* ---- Coordinate grid with several figures (original helper for Unit 4) ----
   opts: {min,max,h, shapes:[{pts,labels,color,dash}], lines:[{a:[x,y],b:[x,y],color,label}], points:[{p,label,color}]} */
function gridPlot(opts){
  var min=(opts.min!==undefined)?opts.min:-7, max=(opts.max!==undefined)?opts.max:7;
  var u=16, pad=16, n=max-min, size=n*u+pad*2;
  function X(x){ return pad+(x-min)*u; } function Y(y){ return pad+(max-y)*u; }
  var s='';
  for(var i=min;i<=max;i++){
    s+='<line x1="'+X(i)+'" y1="'+Y(min)+'" x2="'+X(i)+'" y2="'+Y(max)+'" stroke="var(--gray-line, #CBD3DC)" stroke-width="0.7"/>';
    s+='<line x1="'+X(min)+'" y1="'+Y(i)+'" x2="'+X(max)+'" y2="'+Y(i)+'" stroke="var(--gray-line, #CBD3DC)" stroke-width="0.7"/>';
  }
  if(min<0&&max>0){
    s+='<line x1="'+X(0)+'" y1="'+Y(min)+'" x2="'+X(0)+'" y2="'+Y(max)+'" stroke="var(--gray, #94A0AD)" stroke-width="1.6"/>';
    s+='<line x1="'+X(min)+'" y1="'+Y(0)+'" x2="'+X(max)+'" y2="'+Y(0)+'" stroke="var(--gray, #94A0AD)" stroke-width="1.6"/>';
  }
  (opts.lines||[]).forEach(function(L){
    s+='<line x1="'+X(L.a[0])+'" y1="'+Y(L.a[1])+'" x2="'+X(L.b[0])+'" y2="'+Y(L.b[1])+'" stroke="'+(L.color||'var(--violet)')+'" stroke-width="2" stroke-dasharray="6 4"/>';
    if(L.label) s+='<text x="'+(X(L.b[0])+(L.dx||-4))+'" y="'+(Y(L.b[1])+(L.dy||12))+'" fill="'+(L.color||'var(--violet)')+'" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="700" text-anchor="end">'+L.label+'</text>';
  });
  (opts.shapes||[]).forEach(function(sh){
    var col=sh.color||'var(--blue)';
    var ptsStr=sh.pts.map(function(p){return X(p[0])+','+Y(p[1]);}).join(' ');
    s+=(sh.pts.length>2?'<polygon points="'+ptsStr+'" fill="'+(sh.fill||'none')+'" fill-opacity="0.18"':'<polyline points="'+ptsStr+'" fill="none"')+' stroke="'+col+'" stroke-width="2.6" stroke-linejoin="round"'+(sh.dash?' stroke-dasharray="6 4"':'')+'/>';
    var cx=0,cy=0; sh.pts.forEach(function(p){cx+=p[0];cy+=p[1];}); cx/=sh.pts.length; cy/=sh.pts.length;
    sh.pts.forEach(function(p,i){
      s+='<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="3.4" fill="'+col+'"/>';
      if(sh.labels&&sh.labels[i]){
        var dx=p[0]-cx, dy=p[1]-cy, L=Math.sqrt(dx*dx+dy*dy)||1;
        s+='<text x="'+(X(p[0])+dx/L*13)+'" y="'+(Y(p[1])-dy/L*13+5)+'" fill="'+col+'" font-family="Space Grotesk, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">'+sh.labels[i]+'</text>';
      }
    });
  });
  (opts.points||[]).forEach(function(P){
    s+='<circle cx="'+X(P.p[0])+'" cy="'+Y(P.p[1])+'" r="4" fill="'+(P.color||'var(--ink)')+'"/>';
    if(P.label) s+='<text x="'+(X(P.p[0])+8)+'" y="'+(Y(P.p[1])-7)+'" fill="'+(P.color||'var(--ink)')+'" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="700">'+P.label+'</text>';
  });
  return '<svg viewBox="0 0 '+size+' '+size+'" width="100%" height="'+(opts.h||230)+'" xmlns="http://www.w3.org/2000/svg">'+s+'</svg>';
}

/* ============ Unit 3 diagrams (original, same helper library) ============ */
function arrowTo(x1,y1,x2,y2,color,w){
  var dx=x2-x1, dy=y2-y1, L=Math.sqrt(dx*dx+dy*dy)||1, ux=dx/L, uy=dy/L, px=-uy, py=ux, h=9;
  var bx=x2-ux*h, by=y2-uy*h;
  return lineEl(x1,y1,bx,by,color,w||2.5) + poly(x2+','+y2+' '+(bx+px*5)+','+(by+py*5)+' '+(bx-px*5)+','+(by-py*5),color,1.5,color);
}
function hexagon(cx,cy,r,fill,stroke){
  var p=[]; for(var i=0;i<6;i++){ var a=Math.PI/3*i+Math.PI/6; p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1)); }
  return poly(p.join(' '),stroke,2.2,fill);
}
function pentagon(cx,cy,r,fill,stroke){
  var p=[]; for(var i=0;i<5;i++){ var a=-Math.PI/2+2*Math.PI/5*i; p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1)); }
  return poly(p.join(' '),stroke,2.2,fill);
}
function phos(x,y){ return circleEl(x,y,13,'var(--amber-soft)','var(--amber)',2.2) + txt(x,y+4,'P','var(--amber)',11,700); }
function carbons(x,y,n,color){ var s=''; for(var i=0;i<n;i++) s+=circleEl(x+i*13,y,5.5,'var(--card-bg)',color||'var(--ink)',1.6); return s; }

/* ATP structure */
function diagATP(){
  var inner = hexagon(60,58,26,'var(--teal-soft)','var(--teal)') + txt(60,62,'adenine','var(--teal)',9,700)
    + lineEl(78,78,98,98,'var(--ink)',3)
    + pentagon(118,112,26,'var(--blue-soft)','var(--blue)') + txt(118,117,'ribose','var(--blue)',9,700)
    + lineEl(144,112,176,112,'var(--ink)',3) + phos(190,112)
    + lineEl(203,112,224,112,'var(--ink)',3) + phos(238,112)
    + lineEl(251,112,272,112,'var(--coral)',3,true) + phos(286,112)
    + txt(238,150,'3 phosphate groups','var(--amber)',10,700)
    + txt(262,86,'unstable bond','var(--coral)',9.5,700) + arrowTo(262,92,262,104,'var(--coral)',1.5)
    + txt(170,24,'ATP = adenosine triphosphate','var(--ink)',11,700);
  return svg(inner,'0 0 330 160',165);
}

/* ATP-ADP cycle */
function diagATPCycle(){
  var inner = rectEl(20,24,110,44,12,'var(--amber-soft)','var(--amber)',2.2) + txt(75,44,'ATP','var(--amber)',14,700) + txt(75,60,'3 phosphates','var(--text-soft)',9,600)
    + rectEl(290,24,110,44,12,'var(--blue-soft)','var(--blue)',2.2) + txt(345,44,'ADP + P','var(--blue)',14,700) + txt(345,60,'2 phosphates','var(--text-soft)',9,600)
    + pathEl('M135,36 C190,6 230,6 285,36','var(--coral)',2.5) + poly('277,28 289,38 275,42','var(--coral)',1.5,'var(--coral)')
    + txt(210,-12,'phosphate breaks off (water helps)','var(--coral)',9.5,700)
    + txt(210,2,'→ energy RELEASED for the cell','var(--coral)',9.5,700)
    + pathEl('M285,58 C230,92 190,92 135,58','var(--teal)',2.5) + poly('143,52 131,58 143,66','var(--teal)',1.5,'var(--teal)')
    + txt(210,104,'phosphate added back','var(--teal)',9.5,700)
    + txt(210,118,'← energy from food (or sunlight in plants)','var(--teal)',9.5,700);
  return svg(inner,'0 -24 420 150',150);
}

/* Energy flow: sun -> plant -> consumer */
function diagEnergyFlow(){
  var inner = circleEl(40,60,22,'var(--amber-soft)','var(--amber)',2.5) + txt(40,64,'sun','var(--amber)',10,700)
    + arrowTo(66,60,112,60,'var(--amber)')
    + rectEl(118,36,92,48,10,'var(--teal-soft)','var(--teal)',2.2) + txt(164,56,'plant','var(--teal)',11,700) + txt(164,72,'makes sugar','var(--text-soft)',9,600)
    + arrowTo(214,60,260,60,'var(--teal)')
    + rectEl(266,36,92,48,10,'var(--coral-soft)','var(--coral)',2.2) + txt(312,56,'consumer','var(--coral)',11,700) + txt(312,72,'eats the plant','var(--text-soft)',9,600)
    + txt(89,50,'light','var(--amber)',9,600) + txt(237,50,'food chain','var(--teal)',9,600)
    + txt(210,112,'Both plant and animal cells break sugar down to make ATP','var(--ink)',9.5,700);
  return svg(inner,'0 0 400 124',125);
}

/* Chloroplast structure */
function diagChloroplast(){
  var inner = ellipseEl(200,92,180,76,'var(--teal-soft)','var(--teal)',3) + ellipseEl(200,92,168,66,'none','var(--teal)',1.8);
  var stacks=[90,170,250,320];
  stacks.forEach(function(x){ for(var k=0;k<5;k++){ inner += ellipseEl(x,72+k*12,22,6,'#3E9B5F','#1F6B3A',1.5); } });
  inner += lineEl(112,96,148,96,'#1F6B3A',2) + lineEl(192,96,228,96,'#1F6B3A',2) + lineEl(272,96,298,96,'#1F6B3A',2);
  inner += txt(200,178,'stroma = the fluid around the grana','var(--blue)',10,700);
  inner += txt(90,52,'granum','var(--ink)',10,700) + txt(90,63,'(stack of thylakoids)','var(--text-soft)',8.5,600);
  inner += txt(210,114,'lamella','var(--ink)',9,700) + lineEl(210,106,210,99,'var(--ink)',1);
  inner += txt(340,16,'double membrane','var(--teal)',10,700) + lineEl(340,20,330,28,'var(--teal)',1.5);
  inner += txt(250,142,'thylakoid (contains chlorophyll)','#1F6B3A',9,700);
  return svg(inner,'0 0 400 188',185);
}

/* Overview: two stages in a chloroplast */
function diagOverview(){
  var inner = rectEl(10,30,400,150,30,'var(--teal-soft)','var(--teal)',2.5)
    + rectEl(40,70,120,70,12,'#DDEFE3','#1F6B3A',2) + txt(100,98,'Light-dependent','#1F6B3A',10,700) + txt(100,112,'reactions','#1F6B3A',10,700) + txt(100,128,'(thylakoids)','var(--text-soft)',8.5,600)
    + circleEl(320,105,44,'var(--card-bg)','var(--violet)',2.5) + txt(320,102,'Calvin','var(--violet)',11,700) + txt(320,116,'cycle (stroma)','var(--violet)',8.5,700)
    + arrowTo(166,94,270,94,'var(--amber)') + txt(218,88,'ATP + NADPH','var(--amber)',9.5,700)
    + arrowTo(270,126,166,126,'var(--blue)') + txt(218,140,'ADP + P, NADP⁺','var(--blue)',9.5,700)
    + arrowTo(70,12,82,66,'var(--amber)') + txt(46,14,'light','var(--amber)',10,700)
    + arrowTo(120,12,112,66,'var(--blue)') + txt(140,14,'H₂O','var(--blue)',10,700)
    + arrowTo(320,10,320,58,'var(--ink)') + txt(344,14,'CO₂','var(--ink)',10,700)
    + arrowTo(100,144,100,196,'var(--coral)') + txt(124,196,'O₂','var(--coral)',10,700)
    + arrowTo(320,152,320,196,'var(--teal)') + txt(358,196,'glucose','var(--teal)',10,700);
  return svg(inner,'0 0 420 204',200);
}

/* Light-dependent reactions on the thylakoid membrane */
function diagLightRxn(){
  var inner = rectEl(0,70,440,46,0,'var(--amber-soft)','none',0) + lineEl(0,70,440,70,'var(--teal)',3) + lineEl(0,116,440,116,'var(--teal)',3);
  inner += txt(96,30,'STROMA','var(--text-soft)',9,700,'start') + txt(8,158,'INSIDE THYLAKOID (lumen): H⁺ builds up','var(--coral)',9,700,'start');

/* Absorption graph (stylized) */
function diagSpectrum(){
  var x0=40, x1=400, y0=150;
  function X(nm){ return x0+(nm-400)*(x1-x0)/300; }
  function curve(peaks,color){
    var pts=[]; for(var nm=400;nm<=700;nm+=5){ var v=0; peaks.forEach(function(p){ v+=p[1]*Math.exp(-Math.pow((nm-p[0])/p[2],2)); }); pts.push(X(nm).toFixed(1)+','+(y0-v*110).toFixed(1)); }
    return '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2.6"/>';
  }
  var inner = '';
  var bands=[[400,'#6A4BC4'],[450,'#2E6FD1'],[500,'#2CA08A'],[550,'#5DB54A'],[600,'#E2B33A'],[650,'#E06A2B']];
  bands.forEach(function(b){ inner += '<rect x="'+X(b[0])+'" y="'+(y0+4)+'" width="'+(X(b[0]+50)-X(b[0]))+'" height="10" fill="'+b[1]+'"/>'; });
  inner += lineEl(x0,y0,x1,y0,'var(--ink)',1.5) + lineEl(x0,y0,x0,20,'var(--ink)',1.5);
  inner += curve([[430,0.95,18],[662,0.75,14]],'#1F6B3A') + curve([[455,0.9,18],[642,0.45,14]],'var(--teal)') + curve([[450,0.6,25],[485,0.55,18]],'var(--amber)');
  inner += txt(110,26,'chlorophyll a','#1F6B3A',9.5,700) + txt(200,40,'chlorophyll b','var(--teal)',9.5,700) + txt(260,92,'carotenoids','var(--amber)',9.5,700);
  inner += txt(220,184,'wavelength of light: violet/blue → green → red','var(--text-soft)',9,600);
  inner += txt(228,130,'little green absorbed','var(--coral)',9,700);
  inner += '<text x="14" y="90" fill="var(--text-soft)" font-family="Space Grotesk, sans-serif" font-size="9" font-weight="600" transform="rotate(-90 14 90)" text-anchor="middle">light absorbed</text>';
  return svg(inner,'0 0 420 192',185);
}

  {sec:'calvin', kicker:'3.2 Calvin Cycle', text:'Which list shows the reactants of the Calvin cycle?', opts:['ATP, NADPH, CO₂','Water, sunlight, NADP⁺','Glucose, O₂','ADP, NADP⁺, glucose'], explain:'In: ATP, NADPH, CO₂. Out: ADP, NADP⁺, glucose.'},

  {sec:'calvin', kicker:'3.2 Calvin Cycle', text:'In one turn of the cycle, how many G3P molecules LEAVE to help make glucose?', opts:['1','3','5','6'], explain:'6 G3P are made, 1 leaves, and the other 5 are rearranged back into 3 RuBP.'},
  {sec:'calvin', kicker:'3.2 Calvin Cycle', text:'How many CO₂ molecules are needed to make ONE glucose?', opts:['6','3','12','18'], explain:'3 CO₂ per turn × 2 turns = 6 CO₂, matching the 6 carbons in glucose.'},
  {sec:'calvin', kicker:'3.2 Calvin Cycle', text:'How many ATP does the Calvin cycle use to make ONE glucose (2 turns)?', opts:['18','9','6','12'], explain:'Each turn uses 6 ATP (reduction) + 3 ATP (regeneration) = 9. Two turns: 18.'},
  {sec:'calvin', kicker:'3.2 Pigments', text:'Why do most plants look green?', opts:['Chlorophyll absorbs very little green light, so green is reflected','Chlorophyll absorbs mostly green light','Plants produce green oxygen','Carotenoids are green'], explain:'Chlorophyll absorbs mostly blue/violet and red light. The green light it doesn\'t absorb reaches your eyes.'},
  {sec:'calvin', kicker:'3.2 Leaf Color', text:'Why do leaves turn yellow and orange in the fall?', opts:['Less light makes chlorophyll break down, so other pigments show','Leaves start making extra chlorophyll','Cold weather turns chlorophyll orange','The Calvin cycle speeds up'], explain:'With less light, chlorophyll breaks down. The other colors come from accessory pigments (like carotenoids) and chlorophyll residue.'},
  {sec:'resp', kicker:'3.3 Equation', text:'Which shows the reactants and products of cellular respiration?', opts:['Glucose + oxygen → carbon dioxide + water + ATP','Carbon dioxide + water + light → glucose + oxygen','Glucose → lactic acid','Oxygen + water → glucose + ATP'], explain:'Respiration is the inverse of photosynthesis: glucose and O₂ in; CO₂, H₂O, and energy out.'},
  {sec:'resp', kicker:'3.3 Big Picture', text:'Which is the correct order of the stages of cellular respiration?', opts:['Glycolysis → Krebs cycle → electron transport chain','Krebs cycle → glycolysis → electron transport chain','Electron transport chain → Krebs cycle → glycolysis','Glycolysis → Calvin cycle → electron transport chain'], explain:'Glucose is split first (glycolysis), then the Krebs cycle loads electron carriers, then the ETC makes most of the ATP.'},
  {sec:'resp', kicker:'3.3 Glycolysis', text:'Where does glycolysis take place, and does it need oxygen?', opts:['In the cytoplasm; no, it is anaerobic','In the matrix; yes, it is aerobic','On the cristae; yes, it is aerobic','In the chloroplast; no, it is anaerobic'], explain:'Glycolysis happens outside the mitochondria, in the cytoplasm, and works without oxygen.'},
  {sec:'resp', kicker:'3.3 Glycolysis', text:'What is the NET gain of ATP from glycolysis for one glucose?', opts:['2 ATP','4 ATP','36 ATP','0 ATP'], explain:'4 ATP are made, but 2 were spent to split the glucose, so the net is 2.'},
  {sec:'resp', kicker:'3.3 Glycolysis', text:'During glycolysis, glucose is split into two molecules of:', opts:['pyruvate (3 carbons each)','acetyl-CoA','citric acid','lactic acid'], explain:'Glucose (6-C) → 2 pyruvate (3-C). With oxygen, pyruvate goes on to pre-Krebs.'},
  {sec:'resp', kicker:'3.3 Pre-Krebs', text:'What does coenzyme A (CoA) do?', opts:['Carries the 2-carbon acetyl into the Krebs cycle','Splits glucose in the cytoplasm','Accepts electrons at the end of the ETC','Makes ATP from ADP'], explain:'CoA attaches to acetyl, drops it into the Krebs cycle, then goes back for another one.'},
  {sec:'resp', kicker:'3.3 Krebs Cycle', text:'Where does the Krebs cycle take place, and what major gas does it release?', opts:['The matrix of the mitochondrion; CO₂','The cytoplasm; O₂','The cristae; O₂','The stroma; CO₂'], explain:'The Krebs cycle runs in the matrix, and every carbon it pulls off leaves as CO₂. Most of respiration\'s CO₂ is made here.'},
  {sec:'resp', kicker:'3.3 Krebs Cycle', text:'Why is the Krebs cycle also called the citric acid cycle?', opts:['Acetyl (2-C) joins a 4-C molecule to form citric acid, which is broken down','It produces lemon juice','It uses citric acid from food','Citric acid is the final electron acceptor'], explain:'2 + 4 = 6 carbons of citric acid, which the cycle then breaks down step by step.'},
  {sec:'resp', kicker:'3.3 Krebs Cycle', text:'For one glucose, pre-Krebs plus the Krebs cycle produce:', opts:['6 CO₂, 8 NADH, 2 FADH₂, 2 ATP','2 CO₂, 2 NADH, 0 FADH₂, 36 ATP','6 O₂, 6 NADPH, 2 ATP','2 pyruvate, 2 ATP, 2 NADH'], explain:'(1 + 2) × 2 = 6 CO₂ and (1 + 3) × 2 = 8 NADH, plus 2 FADH₂ and 2 ATP. The last choice is glycolysis.'},
  {sec:'resp', kicker:'3.3 ETC', text:'What is the final electron acceptor at the end of the electron transport chain in cellular respiration?', opts:['Oxygen','Water','NADP⁺','Carbon dioxide'], explain:'Oxygen picks up the electrons, then 2 H⁺, making water. Water is a product, not an acceptor.'},
  {sec:'resp', kicker:'3.3 ETC', text:'Which stage of cellular respiration makes the MOST ATP?', opts:['The electron transport chain (about 32–34 ATP)','Glycolysis (2 ATP)','The Krebs cycle (2 ATP)','Fermentation (2 ATP)'], explain:'H⁺ flowing through ATP synthase on the cristae makes most of the ATP.'},
  {sec:'resp', kicker:'3.3 ETC', text:'Movement of which ions from the intermembrane space back into the matrix makes ATP synthase spin?', opts:['H⁺ (hydrogen ions)','Na⁺ (sodium ions)','O²⁻ (oxygen ions)','K⁺ (potassium ions)'], explain:'The ETC pumps H⁺ into the intermembrane space; they diffuse back through ATP synthase, which makes ATP.'},
  {sec:'resp', kicker:'3.3 Comparing ETCs', text:'What is the key difference between the ETC in respiration and the ETC in photosynthesis?', opts:['The final electron acceptor is different','Only one of them uses ATP synthase','Only one of them pumps H⁺','One is in the nucleus'], explain:'Photosynthesis electrons end on NADP⁺; respiration electrons end on oxygen.'},
  {sec:'resp', kicker:'3.3 Mitochondria', text:'What is the job of the cristae?', opts:['They increase surface area for the electron transport chain','They store DNA','They hold the Krebs cycle fluid','They absorb light'], explain:'More folds = more inner membrane = more room for ETCs, so more ATP.'},
  {sec:'resp', kicker:'3.3 Who Does It', text:'Which organisms carry out cellular respiration?', opts:['Both autotrophs and heterotrophs','Only animals','Only plants','Only bacteria'], explain:'Plants make glucose in photosynthesis, but they still break it down by respiration to make ATP.'},
  {sec:'ferm', kicker:'3.4 Fermentation', text:'What is the main job of fermentation?', opts:['To turn NADH back into NAD⁺ so glycolysis can keep going','To make 36 ATP without oxygen','To make glucose from CO₂','To pump H⁺ across the inner membrane'], explain:'Fermentation regenerates NAD⁺. It doesn\'t make ATP itself, but it keeps glycolysis (2 ATP) running.'},
  {sec:'ferm', kicker:'3.4 Fermentation', text:'Yeast used in bread making ferment sugar. What are the products?', opts:['Ethyl alcohol and carbon dioxide','Lactic acid only','Oxygen and water','Glucose and oxygen'], explain:'Alcoholic fermentation: pyruvate → ethanol + CO₂. The CO₂ bubbles make the dough rise.'},
  {sec:'ferm', kicker:'3.4 Fermentation', text:'After a hard sprint your muscles feel sore. Which product of fermentation is responsible?', opts:['Lactic acid','Ethyl alcohol','Carbon dioxide','Glucose'], explain:'Muscle cells short on oxygen do lactic acid fermentation.'},
  {sec:'ferm', kicker:'3.4 Fermentation', text:'Where does pyruvate go if NO oxygen is available?', opts:['Fermentation','The Krebs cycle','The electron transport chain','The Calvin cycle'], explain:'Without oxygen the ETC backs up, so pyruvate goes to fermentation instead.'},
  {sec:'ferm', kicker:'Review: Interdependence', text:'How do photosynthesis and cellular respiration depend on each other?', opts:['The products of each are the reactants of the other','They both happen only in animals','They both make glucose','Neither one involves gases'], explain:'Photosynthesis makes glucose + O₂ for respiration; respiration makes CO₂ + H₂O for photosynthesis.'},
  {sec:'ferm', kicker:'Review: BTB', text:'You blow through a straw into water with BTB, and it turns yellow. What did you add?', opts:['Carbon dioxide','Oxygen','Glucose','Chlorophyll'], explain:'BTB turns yellow with more CO₂ and blue with more O₂.'},
  {sec:'ferm', kicker:'Review: BTB', text:'A sealed tube holds a snail and a water plant and is kept in the DARK. What happens over time?', opts:['O₂ runs out and CO₂ builds up, because both only do respiration','O₂ builds up, because the plant does photosynthesis','Nothing changes','The BTB turns blue'], explain:'No light means no photosynthesis. Both organisms still respire, using O₂ and releasing CO₂.'},
  {sec:'ferm', kicker:'Review: Graphs', text:'Why does the rate of photosynthesis DROP at very high temperatures?', opts:['The enzymes stop working well','Plants make too much chlorophyll','There is too much CO₂','Light can\'t reach the leaves'], explain:'Photosynthesis is run by enzymes, and too much heat makes them stop working (denature).'}
];
var SECS=[['all','All of Unit 3'],['atp','3.1 Energy & ATP'],['chloro','3.1 Photosynthesis & Chloroplast'],['light','3.2 Light Reactions'],['calvin','3.2 Calvin Cycle & Pigments'],['resp','3.3 Cellular Respiration'],['ferm','3.4 Fermentation & Review']];


/* ---- quiz engine: per-lesson picker + answer order shuffled on every render ---- */
var Q = ALLQ.slice(), idx = 0, score = 0, answered = false, missed = [], shown = [];

function render(){
  var q = Q[idx];
  document.getElementById('qNum').textContent = idx+1;
  document.getElementById('qTotal').textContent = Q.length;
  document.getElementById('scoreLive').textContent = 'Score: '+score;
  document.getElementById('progressFill').style.width = Math.round((idx/Q.length)*100)+'%';
  document.getElementById('qKicker').textContent = q.kicker;
  document.getElementById('qText').innerHTML = q.text;
  var dWrap = document.getElementById('diagramWrap');
  if(q.plot){ dWrap.style.display='block'; dWrap.innerHTML = gridPlot(q.plot); }
  else if(q.diagram && DIAGQ[q.diagram]){ dWrap.style.display='block'; dWrap.innerHTML = DIAGQ[q.diagram](); }
  else { dWrap.style.display='none'; dWrap.innerHTML=''; }
  var optsWrap = document.getElementById('optsWrap');
  optsWrap.innerHTML='';
  var letters=['A','B','C','D'];
  shown = q.opts.map(function(_,k){return k;});
  for(var k=shown.length-1;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=shown[k]; shown[k]=shown[j]; shown[j]=t; }
  shown.forEach(function(orig, i){
    var b = document.createElement('button');
    b.className='opt';
    b.innerHTML = '<span class="letter">'+letters[i]+'</span><span>'+q.opts[orig]+'</span>';
    b.addEventListener('click', function(){ selectAnswer(orig); });
    optsWrap.appendChild(b);
  });
  document.getElementById('explain').classList.remove('show');
  document.getElementById('explain').textContent='';
  document.getElementById('btnNext').disabled = true;
  answered = false;
}

function selectAnswer(i){
  if(answered) return;
  answered = true;
  var q = Q[idx];
  document.querySelectorAll('.opt').forEach(function(el,pos){
    var i2 = shown[pos];
    el.classList.add('locked');
    if(i2===0) el.classList.add('correct');
    else if(i2===i) el.classList.add('incorrect');
    else el.classList.add('dim');
  });
  if(i===0) score++; else missed.push(q);
  document.getElementById('scoreLive').textContent = 'Score: '+score;
  var ex = document.getElementById('explain');
  ex.innerHTML = '<b>'+(i===0?'Correct. ':'Not quite. ')+'</b>'+q.explain;
  ex.classList.add('show');
  document.getElementById('btnNext').disabled = false;
}

function nextQuestion(){ if(idx < Q.length-1){ idx++; render(); } else { showResults(); } }

function showResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  document.getElementById('finalScore').textContent = score+' / '+Q.length;
  var pct = Math.round((score/Q.length)*100), msg;
  if(pct===100) msg = 'Perfect score — locked in.';
  else if(pct>=80) msg = 'Strong work. Review the missed ones below and you\'ve got it.';
  else if(pct>=60) msg = 'Good start — a few gaps to close. Check the missed questions below.';
  else msg = 'Worth another pass through the flashcards before the next round.';
  document.getElementById('finalMsg').textContent = msg+' ('+pct+'%)';
  var list = document.getElementById('missedList'); list.innerHTML='';
  if(missed.length===0){ var li=document.createElement('li'); li.textContent='No missed questions — nice.'; list.appendChild(li); }
  else missed.forEach(function(q){ var li=document.createElement('li'); li.innerHTML='<b>'+q.text+'</b>Correct answer: '+q.opts[0]; list.appendChild(li); });
}

var currentSec = 'all';
function startSec(k){
  currentSec = k;
  Q = k==='all' ? ALLQ.slice() : ALLQ.filter(function(x){return x.sec===k;});
  idx=0; score=0; missed=[]; answered=false;
  document.getElementById('resultsArea').style.display='none';
  document.getElementById('quizArea').style.display='block';
  var label=SECS.filter(function(s){return s[0]===k;})[0][1];
  document.getElementById('heroSub').textContent = Q.length+' questions · '+label+'. Pick a lesson below or take the whole unit. Answer order shuffles every time.';
  Array.prototype.forEach.call(document.getElementById('secPicker').children,function(b){b.classList.toggle('active',b.dataset.k===k);});
  render();
}
document.getElementById('btnNext').addEventListener('click', nextQuestion);
document.getElementById('btnRetake').addEventListener('click', function(){ startSec(currentSec); });
(function(){ var p=document.getElementById('secPicker');
  SECS.forEach(function(s){ var b=document.createElement('button'); b.textContent=s[1]; b.dataset.k=s[0]; b.onclick=function(){startSec(s[0]);}; p.appendChild(b); });
})();
startSec('all');
</script>
