<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jackson's Study Site</title>
<style>
  :root {
    --bg: #FBFAF7;
    --ink: #1C2B4A;
    --text: #2B3648;
    --text-soft: #64707F;
    --blue: #2E86AB;
    --blue-soft: #E9F3F8;
    --teal: #2C9C82;
    --teal-soft: #E6F5F0;
    --border: #E4E0D4;
    --card-bg: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }
  h1 { color: var(--ink); font-size: 1.8rem; margin: 0 0 8px; }
  p.sub { color: var(--text-soft); margin: 0 0 32px; }
  .card {
    display: block;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 24px;
    margin-bottom: 14px;
    text-decoration: none;
    color: inherit;
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }
  .card:hover { box-shadow: 0 4px 14px rgba(28,43,74,0.08); transform: translateY(-1px); }
  .card h2 { margin: 0 0 4px; font-size: 1.2rem; color: var(--ink); }
  .card p { margin: 0; color: var(--text-soft); font-size: 0.92rem; }
  .tag {
    display: inline-block;
    background: var(--blue-soft);
    color: var(--blue);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .tag.teal { background: var(--teal-soft); color: var(--teal); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Jackson's Study Site</h1>
    <p class="sub">Pick a subject to see its study guides, flashcards, and quizzes.</p>

    <a class="card" href="geometry.html">
      <span class="tag">Geometry</span>
      <h2>Geometry</h2>
      <p>Units 2–3 so far: proofs, then quadrilaterals. Each unit has a study guide, flashcards, and a quiz.</p>
    </a>

    <a class="card" href="biology.html">
      <span class="tag teal">Biology</span>
      <h2>Biology</h2>
      <p>Set up and ready for the first unit's materials.</p>
    </a>
  </div>
</body>
</html>
