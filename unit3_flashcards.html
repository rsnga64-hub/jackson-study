<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 3 Flashcards: Quadrilaterals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBFAF7;
    --grid-line: rgba(28,43,74,0.055);
    --ink: #1C2B4A;
    --text: #2B3648;
    --text-soft: #64707F;
    --blue: #2E86AB;
    --blue-soft: #E9F3F8;
    --amber: #D98A2B;
    --amber-soft: #FCF1DE;
    --coral: #D65A5A;
    --coral-soft: #FBEBEB;
    --teal: #2C9C82;
    --teal-soft: #E6F5F0;
    --violet: #7C5CBF;
    --violet-soft: #EFE9F8;
    --card-bg: #FFFFFF;
    --border: #E4E0D4;
    --gray: #94A0AD;
    --gray-line: #CBD3DC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  h1, h2, h3, .display { font-family: 'Space Grotesk', sans-serif; color: var(--ink); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
  a { color: inherit; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-soft); text-decoration: none; font-size: 0.88rem; font-weight: 600; margin-bottom: 18px; }
  .back-link:hover { color: var(--blue); }

  /* ---------- Hero ---------- */
  .hero {
    background: var(--ink);
    border-radius: 18px;
    padding: 26px 28px;
    color: #fff;
    margin-bottom: 22px;
  }
  .hero h1 { color: #fff; font-size: 1.7rem; margin: 0 0 6px; line-height: 1.15; }
  .hero p { margin: 0; color: #C8D3E0; font-size: 0.96rem; max-width: 52ch; }

  /* ---------- Category tabs ---------- */
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 20px; }
  .tab-btn {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 0.84rem;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-soft);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tab-btn:hover { border-color: var(--ink); color: var(--ink); }
  .tab-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* ---------- Progress / stats ---------- */
  .statline {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.82rem; color: var(--text-soft); margin-bottom: 10px; flex-wrap: wrap; gap: 6px;
  }
  .statline b { color: var(--ink); }
  .progress-track { height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; margin-bottom: 18px; }
  .progress-fill { height: 100%; background: var(--blue); border-radius: 999px; transition: width 0.2s ease; }

  /* ---------- Flashcard ---------- */
  .stage { perspective: 1600px; margin-bottom: 18px; }
  .flashcard {
    position: relative;
    min-height: 380px;
    border-radius: 18px;
    cursor: pointer;
    transition: transform 0.5s cubic-bezier(.4,.2,.2,1);
    transform-style: preserve-3d;
  }
  .flashcard.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    box-shadow: 0 4px 18px rgba(28,43,74,0.07);
    padding: 26px 28px;
    display: flex; flex-direction: column;
  }
  .face.back { transform: rotateY(180deg); }
  .cat-tag {
    display: inline-flex; align-self: flex-start;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 0.72rem;
    letter-spacing: 0.02em; text-transform: uppercase;
    padding: 4px 11px; border-radius: 999px; margin-bottom: 14px;
  }
  .face.front { align-items: center; text-align: center; justify-content: center; }
  .term { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--ink); font-size: 1.55rem; line-height: 1.25; margin: 0; }
  .flip-hint { margin-top: 18px; font-size: 0.8rem; color: var(--gray); }
  .def { font-size: 1.05rem; font-weight: 600; color: var(--ink); line-height: 1.4; margin: 0 0 10px; }
  .extra { font-size: 0.9rem; color: var(--text-soft); line-height: 1.45; margin: 0 0 14px; }
  .diagram-wrap { margin-top: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 6px; }
  .diagram-wrap svg { display: block; width: 100%; height: auto; max-height: 190px; }

  /* ---------- Controls ---------- */
  .controls { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .btn {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.88rem;
    border: 1px solid var(--border); background: var(--card-bg); color: var(--ink);
    border-radius: 10px; padding: 10px 16px; cursor: pointer; transition: all 0.15s ease;
  }
  .btn:hover { border-color: var(--ink); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.primary:hover { opacity: 0.9; }
  .rate-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 6px; }
  .btn.rate-bad { border-color: var(--coral); color: var(--coral); }
  .btn.rate-bad:hover { background: var(--coral-soft); }
  .btn.rate-good { border-color: var(--teal); color: var(--teal); }
  .btn.rate-good:hover { background: var(--teal-soft); }

  .tally { text-align: center; font-size: 0.82rem; color: var(--text-soft); margin-top: 4px; }
  .tally b.good { color: var(--teal); }
  .tally b.bad { color: var(--coral); }

  @media (max-width: 480px) {
    .flashcard { min-height: 420px; }
    .term { font-size: 1.3rem; }
  }
</style>

<script>
/* ============ Diagram helpers ============ */
function svg(inner, vb, h) {
  return '<svg viewBox="'+vb+'" width="100%" height="'+(h||180)+'" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg>';
}
function lineEl(x1,y1,x2,y2,color,w,dash){ return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(color||'var(--ink)')+'" stroke-width="'+(w||2.5)+'" stroke-linecap="round"'+(dash?' stroke-dasharray="5 4"':'')+'/>'; }
function dot(x,y,color){ return '<circle cx="'+x+'" cy="'+y+'" r="3.2" fill="'+(color||'var(--ink)')+'"/>'; }
function txt(x,y,s,color,size,weight,anchor){ return '<text x="'+x+'" y="'+y+'" fill="'+(color||'var(--ink)')+'" font-family="Space Grotesk, sans-serif" font-size="'+(size||13)+'" font-weight="'+(weight||700)+'" text-anchor="'+(anchor||'middle')+'">'+s+'</text>'; }
function poly(pts,color,w){ return '<polygon points="'+pts+'" fill="none" stroke="'+(color||'var(--ink)')+'" stroke-width="'+(w||2.5)+'" stroke-linejoin="round"/>'; }

/* single/double chevron ("parallel" arrow marks) at midpoint of a segment, oriented along (dx,dy) */
function chevron(mx,my,dx,dy,color,double_){
  var len=Math.sqrt(dx*dx+dy*dy); var ux=dx/len, uy=dy/len; var px=-uy, py=ux;
  function mark(cx,cy){
    var backX=cx-ux*7, backY=cy-uy*7, tipX=cx+ux*7, tipY=cy+uy*7;
    var t1x=backX+px*6, t1y=backY+py*6, t2x=backX-px*6, t2y=backY-py*6;
    return '<line x1="'+t1x+'" y1="'+t1y+'" x2="'+tipX+'" y2="'+tipY+'" stroke="'+color+'" stroke-width="2.4" stroke-linecap="round"/>'
         + '<line x1="'+t2x+'" y1="'+t2y+'" x2="'+tipX+'" y2="'+tipY+'" stroke="'+color+'" stroke-width="2.4" stroke-linecap="round"/>';
  }
  if(double_) return mark(mx-ux*5,my-uy*5) + mark(mx+ux*5,my+uy*5);
  return mark(mx,my);
}
/* single/double perpendicular tick mark ("congruent side") at midpoint of a segment along (dx,dy) */
function tick(mx,my,dx,dy,color,double_){
  var len=Math.sqrt(dx*dx+dy*dy); var ux=dx/len, uy=dy/len; var px=-uy, py=ux;
  function mark(cx,cy){
    return '<line x1="'+(cx-px*7)+'" y1="'+(cy-py*7)+'" x2="'+(cx+px*7)+'" y2="'+(cy+py*7)+'" stroke="'+color+'" stroke-width="2.4" stroke-linecap="round"/>';
  }
  if(double_) return mark(mx-ux*4,my-uy*4) + mark(mx+ux*4,my+uy*4);
  return mark(mx,my);
}
/* small square "right angle" mark at corner (x,y), given two outward UNIT direction vectors along the two sides */
function rightAngle(x,y,dx1,dy1,dx2,dy2,color,size){
  size = size||11;
  var p1x=x+dx1*size, p1y=y+dy1*size;
  var p2x=x+dx2*size, p2y=y+dy2*size;
  var p3x=p1x+dx2*size, p3y=p1y+dy2*size;
  return '<polyline points="'+p1x+','+p1y+' '+p3x+','+p3y+' '+p2x+','+p2y+'" fill="none" stroke="'+color+'" stroke-width="2"/>';
}

/* --- Parallel slope --- */
function diagParallelSlope(){
  var color='var(--blue)';
  var inner = lineEl(30,170,130,50) + lineEl(170,170,270,50)
    + chevron(80,110,100,-120,color,false) + chevron(220,110,100,-120,color,false)
    + txt(150,195,'Same slope → lines never cross','var(--text-soft)',12,600);
  return svg(inner,'0 0 300 210',175);
}
/* --- Perpendicular slope --- */
function diagPerpSlope(){
  var color='var(--coral)';
  var inner = lineEl(40,230,260,50) + lineEl(40,50,260,230)
    + rightAngle(150,140,0.848,-0.53,-0.53,-0.848,color,16)
    + txt(150,255,'Negative reciprocal slopes → 90°','var(--text-soft)',12,600);
  return svg(inner,'0 0 300 270',175);
}

/* --- Parallelogram --- */
function diagParallelogram(){
  var A=[50,170], B=[230,170], C=[200,70], D=[20,70];
  var color='var(--teal)';
  var inner = poly(A+' '+B+' '+C+' '+D, 'var(--ink)')
    + chevron(140,170,180,0,color,false) + chevron(110,70,180,0,color,false)
    + chevron(35,120,-30,-100,color,true) + chevron(215,120,-30,-100,color,true)
    + txt(140,192,'A','var(--gray)',11,600) ;
  return svg(inner,'0 0 260 210',170);
}
/* --- Rectangle --- */
function diagRectangle(){
  var color='var(--blue)';
  var inner = poly('40,170 260,170 260,70 40,70','var(--ink)')
    + rightAngle(40,170,1,0,0,-1,color) + rightAngle(260,170,-1,0,0,-1,color)
    + rightAngle(260,70,-1,0,0,1,color) + rightAngle(40,70,1,0,0,1,color)
    + lineEl(40,170,260,70,'var(--gray-line)',1.5,true) + lineEl(40,70,260,170,'var(--gray-line)',1.5,true)
    + txt(150,195,'4 right angles · diagonals congruent','var(--text-soft)',11.5,600);
  return svg(inner,'0 0 300 210',170);
}
/* --- Rhombus --- */
function diagRhombus(){
  var color='var(--teal)';
  var A=[150,30], B=[250,110], C=[150,190], D=[50,110];
  var inner = poly(A+' '+B+' '+C+' '+D,'var(--ink)')
    + tick(200,70,100,80,color,false) + tick(200,150,100,80,color,false)
    + tick(100,150,100,-80,color,false) + tick(100,70,100,-80,color,false)
    + lineEl(A[0],A[1],C[0],C[1],'var(--gray-line)',1.5,true) + lineEl(B[0],B[1],D[0],D[1],'var(--gray-line)',1.5,true)
    + rightAngle(150,110,0,-1,1,0,'var(--coral)',9)
    + txt(150,215,'4 congruent sides · diagonals ⊥','var(--text-soft)',11.5,600);
  return svg(inner,'0 0 300 230',175);
}
/* --- Square --- */
function diagSquare(){
  var color='var(--violet)';
  var inner = poly('70,170 230,170 230,70 70,70','var(--ink)')
    + rightAngle(70,170,1,0,0,-1,color) + rightAngle(230,170,-1,0,0,-1,color)
    + rightAngle(230,70,-1,0,0,1,color) + rightAngle(70,70,1,0,0,1,color)
    + tick(150,170,160,0,color,false) + tick(150,70,160,0,color,false)
    + tick(70,120,0,100,color,false) + tick(230,120,0,100,color,false)
    + txt(150,195,'Every parallelogram + rectangle + rhombus property','var(--text-soft)',10.5,600);
  return svg(inner,'0 0 300 210',170);
}
/* --- Trapezoid --- */
function diagTrapezoid(){
  var color='var(--teal)';
  var inner = poly('40,170 260,170 190,70 110,70','var(--ink)')
    + chevron(150,170,220,0,color,false) + chevron(150,70,80,0,color,false)
    + txt(150,192,'Exactly one pair of parallel sides (bases)','var(--text-soft)',11,600);
  return svg(inner,'0 0 300 205',170);
}
/* --- Isosceles Trapezoid --- */
function diagIsoTrapezoid(){
  var color='var(--teal)'; var legColor='var(--coral)';
  var A=[50,170], B=[250,170], C=[190,70], D=[110,70];
  var inner = poly(A+' '+B+' '+C+' '+D,'var(--ink)')
    + chevron(150,170,200,0,color,false) + chevron(150,70,80,0,color,false)
    + tick(80,120,60,-100,legColor,false) + tick(220,120,-60,-100,legColor,false)
    + txt(150,192,'Congruent legs · congruent base angles · congruent diagonals','var(--text-soft)',10,600);
  return svg(inner,'0 0 300 205',170);
}
/* --- Kite --- */
function diagKite(){
  var colorTop='var(--violet)', colorBot='var(--blue)';
  var T=[150,30], R=[220,110], Bm=[150,190], L=[80,110];
  var inner = poly(T+' '+R+' '+Bm+' '+L,'var(--ink)')
    + tick(185,70,70,80,colorTop,false) + tick(115,70,-70,80,colorTop,false)
    + tick(185,150,70,-80,colorBot,true) + tick(115,150,-70,-80,colorBot,true)
    + lineEl(T[0],T[1],Bm[0],Bm[1],'var(--gray-line)',1.5,true) + lineEl(L[0],L[1],R[0],R[1],'var(--gray-line)',1.5,true)
    + rightAngle(150,110,0,-1,1,0,'var(--coral)',9)
    + txt(150,215,'2 pairs of CONSECUTIVE congruent sides · diagonals ⊥','var(--text-soft)',10,600);
  return svg(inner,'0 0 300 230',175);
}

/* --- Midpoint --- */
function diagMidpoint(){
  var inner = lineEl(40,160,260,50,'var(--ink)')
    + dot(40,160) + dot(260,50) + '<circle cx="150" cy="105" r="5" fill="var(--amber)"/>'
    + tick(95,132.5,220,-110,'var(--amber)',false) + tick(205,77.5,220,-110,'var(--amber)',false)
    + txt(52,180,'(x₁, y₁)','var(--text-soft)',12,600) + txt(260,38,'(x₂, y₂)','var(--text-soft)',12,600)
    + txt(150,208,'M = average of the x\'s, average of the y\'s','var(--amber)',11,700);
  return svg(inner,'0 0 300 220',170);
}
/* --- Distance --- */
function diagDistance(){
  var inner = lineEl(50,170,250,170,'var(--gray)',2,true) + lineEl(250,170,250,50,'var(--gray)',2,true)
    + lineEl(50,170,250,50,'var(--blue)',3)
    + rightAngle(250,170,-1,0,0,-1,'var(--gray)',12)
    + dot(50,170) + dot(250,50)
    + txt(150,190,'x₂ − x₁','var(--text-soft)',12,600) + txt(272,115,'y₂ − y₁','var(--text-soft)',12,600,'start')
    + txt(130,100,'d','var(--blue)',16,700);
  return svg(inner,'0 0 320 205',170);
}
/* --- Diagonals bisect --- */
function diagBisect(){
  var A=[40,160], B=[90,50], C=[270,50], D=[220,160];
  var inner = poly(A+' '+B+' '+C+' '+D,'var(--ink)')
    + lineEl(A[0],A[1],C[0],C[1],'var(--coral)',2) + lineEl(B[0],B[1],D[0],D[1],'var(--coral)',2)
    + '<circle cx="155" cy="105" r="4.5" fill="var(--coral)"/>'
    + tick(97.5,132.5,230,-110,'var(--teal)',false) + tick(212.5,77.5,230,-110,'var(--teal)',false)
    + tick(122.5,77.5,130,110,'var(--blue)',true) + tick(187.5,132.5,130,110,'var(--blue)',true)
    + txt(155,190,'Same midpoint → the diagonals bisect each other','var(--text-soft)',11,600);
  return svg(inner,'0 0 310 200',170);
}

/* ============ Card data ============ */
var CATS = [
  {key:'slopes', label:'Slopes & Lines', color:'var(--blue)'},
  {key:'quads', label:'Quad Properties', color:'var(--teal)'},
  {key:'algebra', label:'Quad Algebra', color:'var(--coral)'},
  {key:'formulas', label:'Formulas', color:'var(--amber)'},
  {key:'coord', label:'Coordinate Proofs', color:'var(--violet)'}
];
function catInfo(key){ for(var i=0;i<CATS.length;i++) if(CATS[i].key===key) return CATS[i]; return CATS[0]; }

var CARDS = [
  {cat:'slopes', term:'Literal Equation', def:'An equation with more than one variable, like y = mx + b.', extra:'"Solve for m" means isolate m with the usual steps and treat the other letters like numbers: m = (y − b) / x', diagram:null},
  {cat:'slopes', term:'Parallel Lines (slope)', def:'Parallel lines have the same slope.', extra:'A line parallel to y = 3x + 4 also has slope 3.', diagram:diagParallelSlope},
  {cat:'slopes', term:'Perpendicular Lines (slope)', def:'Perpendicular lines have slopes that are negative reciprocals.', extra:'Flip the fraction, then switch the sign: 3 → −1/3, and 2/3 → −3/2.', diagram:diagPerpSlope},
  {cat:'slopes', term:'Line Through a Point', def:'Get the slope (same for ∥, negative reciprocal for ⊥), plug the point into y = mx + b, and solve for b.', extra:'∥ to y = 2x − 1 through (4, 3): 3 = 2(4) + b → b = −5 → y = 2x − 5', diagram:null},

  {cat:'quads', term:'Quadrilateral', def:'A polygon with 4 sides and 4 angles.', extra:'The interior angles always add up to 360°.', diagram:null},
  {cat:'quads', term:'Parallelogram', def:'Opposite sides ∥ and ≅; opposite angles ≅; consecutive angles supplementary; diagonals bisect each other.', extra:'Rectangles, rhombi, and squares are all special parallelograms.', diagram:diagParallelogram},
  {cat:'quads', term:'Rectangle', def:'A parallelogram with 4 right angles.', extra:'Bonus property: the diagonals are congruent.', diagram:diagRectangle},
  {cat:'quads', term:'Rhombus', def:'A parallelogram with 4 congruent sides.', extra:'Bonus properties: diagonals are perpendicular, and diagonals bisect the angles.', diagram:diagRhombus},
  {cat:'quads', term:'Square', def:'Has every property of a parallelogram, a rectangle, AND a rhombus.', extra:'Needs BOTH 4 right angles AND 4 congruent sides. Diagonals are ≅ AND ⊥.', diagram:diagSquare},
  {cat:'quads', term:'Trapezoid', def:'A quadrilateral with only ONE pair of parallel sides (the bases).', extra:'Consecutive angles between the bases are supplementary. A trapezoid is never a parallelogram.', diagram:diagTrapezoid},
  {cat:'quads', term:'Isosceles Trapezoid', def:'A trapezoid whose legs (non-parallel sides) are congruent.', extra:'Also: base angles ≅, diagonals ≅, opposite angles supplementary.', diagram:diagIsoTrapezoid},
  {cat:'quads', term:'Kite', def:'Exactly 2 pairs of CONSECUTIVE congruent sides.', extra:'One pair of opposite angles ≅; diagonals ⊥; only one diagonal gets bisected. Not a parallelogram.', diagram:diagKite},
  {cat:'quads', term:'Always / Sometimes / Never', def:'A square is ALWAYS a rectangle and a rhombus. A parallelogram is SOMETIMES a rectangle. A trapezoid is NEVER a parallelogram.', extra:'A rhombus is only sometimes a square, because it needs right angles too.', diagram:null},

  {cat:'algebra', term:'Opposite Sides / Angles', def:'In a parallelogram, opposite sides are ≅ and opposite angles are ≅.', extra:'Two opposite parts labeled with expressions? Set them equal and solve.', diagram:null},
  {cat:'algebra', term:'Consecutive Angles', def:'In a parallelogram, consecutive angles are supplementary (add to 180°).', extra:'Same for the two angles along each leg of a trapezoid.', diagram:null},
  {cat:'algebra', term:'Diagonals Bisect Each Other', def:'In a parallelogram, each diagonal is cut into two equal pieces.', extra:'Piece = piece. Whole diagonal = 2 × piece.', diagram:diagBisect},
  {cat:'algebra', term:'Congruent Diagonals', def:'Rectangles, squares, and isosceles trapezoids have congruent diagonals.', extra:'Two whole diagonals labeled? Set them equal.', diagram:null},
  {cat:'algebra', term:'Perpendicular Diagonals → Pythagorean Theorem', def:'In a rhombus, square, or kite, the diagonals meet at 90°, making right triangles.', extra:'Rhombus with diagonals 18 and 24: halves are 9 and 12 → side = √(81 + 144) = 15.', diagram:null},
  {cat:'algebra', term:'Isosceles Trapezoid Angles', def:'Base angles are congruent; angles along a leg add to 180°.', extra:'One base angle is 68° → the other base angle is 68°, and the other two are 112° each.', diagram:null},
  {cat:'algebra', term:'Kite Angles', def:'A kite has one pair of congruent opposite angles: the angles between the non-congruent sides.', extra:'Set those two angle expressions equal. All four angles still add to 360°.', diagram:null},

  {cat:'formulas', term:'Midpoint Formula', def:'(xₘ, yₘ) = ( (x₁ + x₂)/2 , (y₁ + y₂)/2 )', extra:'Midpoint of (−3, 8) and (5, −2) is (1, 3).', diagram:diagMidpoint},
  {cat:'formulas', term:'Missing Endpoint', def:'Run the midpoint formula backwards: (x₁ + x)/2 = xₘ, so x = 2xₘ − x₁. Same for y.', extra:'A(2, −7), M(5, −1) → B(8, 5).', diagram:null},
  {cat:'formulas', term:'Slope Formula', def:'m = rise/run = (y₂ − y₁) / (x₂ − x₁)', extra:'Keep the order the same on top and bottom. Slope of (−2, 6) and (4, −3) is −3/2.', diagram:null},
  {cat:'formulas', term:'Distance Formula', def:'d = √[ (x₂ − x₁)² + (y₂ − y₁)² ]', extra:'It\'s the Pythagorean theorem on the grid. Distance from (1, −2) to (7, 6) is 10.', diagram:diagDistance},
  {cat:'formulas', term:'Simplify the Radical', def:'Pull out perfect-square factors: √50 = √(25 · 2) = 5√2.', extra:'√20 = 2√5, √18 = 3√2, √90 = 3√10. Answers are usually left in this form.', diagram:null},
  {cat:'formulas', term:'Missing Coordinate from a Distance', def:'Square both sides, isolate the squared term, then take the square root with ±.', extra:'There are usually TWO answers, e.g. y − 4 = ±5 → y = 9 or y = −1.', diagram:null},

  {cat:'coord', term:'Which Formula Shows What?', def:'Slope → ∥ or ⊥. Distance → ≅ lengths. Midpoint → diagonals bisect each other.', extra:'Choose the formula that matches the property you need to prove.', diagram:null},
  {cat:'coord', term:'Prove a Parallelogram', def:'Fastest: the two diagonals have the same midpoint (they bisect each other).', extra:'Other ways: both pairs of opposite sides ∥ (slope), both pairs ≅ (distance), or one pair both ∥ and ≅.', diagram:null},
  {cat:'coord', term:'Rectangle Test', def:'A parallelogram with congruent diagonals (distance), or with consecutive sides ⊥ (slope).', extra:'If the diagonals are also ⊥, it\'s a square instead.', diagram:null},
  {cat:'coord', term:'Rhombus Test', def:'A parallelogram with perpendicular diagonals (slope), or with 4 congruent sides (distance).', extra:'Check the midpoints first. A kite has ⊥ diagonals too.', diagram:null},
  {cat:'coord', term:'Square Test', def:'A parallelogram whose diagonals are BOTH congruent and perpendicular.', extra:'Or: consecutive sides both ⊥ and ≅. Slope alone only says "might be a square." Confirm with distance.', diagram:null},
  {cat:'coord', term:'Trapezoid Test', def:'Slope: exactly ONE pair of opposite sides parallel.', extra:'Then use distance on the legs. If they\'re ≅ it\'s an isosceles trapezoid.', diagram:null},
  {cat:'coord', term:'Kite Test', def:'Distance: 2 pairs of CONSECUTIVE sides congruent (AB = DA and BC = CD).', extra:'The diagonals\' midpoints won\'t match, since it\'s not a parallelogram.', diagram:null},
  {cat:'coord', term:'Just a Quadrilateral', def:'Not a parallelogram (midpoints differ), not a trapezoid (no ∥ sides), not a kite (no consecutive ≅ pairs).', extra:'Show all three checks fail before calling it "just a quadrilateral."', diagram:null}
];

/* ============ Deck state & rendering ============ */
var activeCat = 'all';
var order = CARDS.map(function(_,i){return i;});
var pos = 0;
var flipped = false;
var goodCount = 0, badCount = 0;
var seenRated = {};

function currentIndices(){
  if(activeCat==='all') return order;
  return order.filter(function(i){ return CARDS[i].cat===activeCat; });
}

function buildTabs(){
  var tabsEl = document.getElementById('tabs');
  var allBtn = document.createElement('button');
  allBtn.className='tab-btn active'; allBtn.textContent='All'; allBtn.dataset.key='all';
  tabsEl.appendChild(allBtn);
  CATS.forEach(function(c){
    var b=document.createElement('button');
    b.className='tab-btn'; b.textContent=c.label; b.dataset.key=c.key;
    tabsEl.appendChild(b);
  });
  tabsEl.addEventListener('click', function(e){
    if(e.target.tagName!=='BUTTON') return;
    activeCat = e.target.dataset.key;
    Array.prototype.forEach.call(tabsEl.children, function(b){ b.classList.toggle('active', b.dataset.key===activeCat); });
    document.getElementById('filterLabel').textContent = activeCat==='all' ? 'All cards' : catInfo(activeCat).label;
    pos = 0; flipped=false;
    renderCard();
  });
}

function renderCard(){
  var idxs = currentIndices();
  if(idxs.length===0) return;
  if(pos>=idxs.length) pos=0;
  var card = CARDS[idxs[pos]];
  var info = catInfo(card.cat);

  document.getElementById('flashcard').classList.remove('flipped');
  flipped=false;

  document.getElementById('catTagFront').textContent = info.label;
  document.getElementById('catTagFront').style.background = info.color;
  document.getElementById('catTagFront').style.color = '#fff';
  document.getElementById('catTagBack').textContent = info.label;
  document.getElementById('catTagBack').style.background = info.color;
  document.getElementById('catTagBack').style.color = '#fff';

  document.getElementById('termText').textContent = card.term;
  document.getElementById('defText').textContent = card.def;
  document.getElementById('extraText').textContent = card.extra || '';

  var dWrap = document.getElementById('diagramWrap');
  if(card.diagram){
    dWrap.style.display='block';
    dWrap.innerHTML = card.diagram();
  } else {
    dWrap.style.display='none';
    dWrap.innerHTML='';
  }

  document.getElementById('cardNum').textContent = pos+1;
  document.getElementById('cardTotal').textContent = idxs.length;
  document.getElementById('progressFill').style.width = Math.round(((pos+1)/idxs.length)*100)+'%';

  document.getElementById('rateRow').style.visibility='hidden';
  updateTally();
}

function updateTally(){
  var t = document.getElementById('tally');
  if(goodCount+badCount===0){ t.textContent=''; return; }
  t.innerHTML = '<b class="good">'+goodCount+'</b> got it &middot; <b class="bad">'+badCount+'</b> still learning';
}

function nextCard(){ var idxs=currentIndices(); pos=(pos+1)%idxs.length; renderCard(); }
function prevCard(){ var idxs=currentIndices(); pos=(pos-1+idxs.length)%idxs.length; renderCard(); }
function shuffleDeck(){
  for(var i=order.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=order[i]; order[i]=order[j]; order[j]=t; }
  pos=0; goodCount=0; badCount=0; seenRated={}; renderCard();
}

document.getElementById('flashcard').addEventListener('click', function(){
  flipped=!flipped;
  this.classList.toggle('flipped', flipped);
  document.getElementById('rateRow').style.visibility = flipped ? 'visible' : 'hidden';
});
document.getElementById('btnNext').addEventListener('click', function(e){ e.stopPropagation(); nextCard(); });
document.getElementById('btnPrev').addEventListener('click', function(e){ e.stopPropagation(); prevCard(); });
document.getElementById('btnShuffle').addEventListener('click', function(e){ e.stopPropagation(); shuffleDeck(); });
document.getElementById('btnGood').addEventListener('click', function(e){
  e.stopPropagation();
  var idxs=currentIndices(); var key=idxs[pos];
  if(seenRated[key]==='bad') badCount--; if(seenRated[key]!=='good'){ goodCount++; seenRated[key]='good'; }
  updateTally(); nextCard();
});
document.getElementById('btnBad').addEventListener('click', function(e){
  e.stopPropagation();
  var idxs=currentIndices(); var key=idxs[pos];
  if(seenRated[key]==='good') goodCount--; if(seenRated[key]!=='bad'){ badCount++; seenRated[key]='bad'; }
  updateTally(); nextCard();
});

buildTabs();
renderCard();
</script>
