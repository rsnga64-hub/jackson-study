<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometry - Removed per Teacher Request</title>
<style>
  :root {
    --bg: #FBFAF7;
    --ink: #1C2B4A;
    --text: #2B3648;
    --text-soft: #64707F;
    --blue: #2E86AB;
    --blue-soft: #E9F3F8;
    --border: #E4E0D4;
    --card-bg: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }
  a { color: inherit; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-soft); text-decoration: none; font-size: 0.88rem; font-weight: 600; margin-bottom: 18px; }
  .back-link:hover { color: var(--blue); }
  h1 { color: var(--ink); font-size: 1.6rem; margin: 0 0 8px; }
  .notice {
    background: var(--card-bg);
    border: 1px dashed var(--border);
    border-radius: 14px;
    padding: 32px 26px;
    text-align: center;
  }
  .notice .icon { font-size: 1.8rem; margin-bottom: 10px; }
  .notice p { margin: 0; color: var(--text-soft); font-size: 0.95rem; max-width: 46ch; margin: 0 auto; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back-link" href="index.html">&larr; All subjects</a>
    <h1>Geometry - Removed per Teacher Request</h1>
    <div class="notice">
      <div class="icon">🚫</div>
      <p>This Geometry flashcard deck has been taken down at the teacher's request and is no longer available on this site.</p>
    </div>
  </div>
</body>
</html>
