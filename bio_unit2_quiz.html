<style>
  :root {
    --bg: #FBFAF7;
    --grid-line: rgba(28,43,74,0.055);
    --ink: #1C2B4A;
    --text: #2B3648;
    --text-soft: #64707F;
    --blue: #2E86AB;
    --blue-soft: #E9F3F8;
    --amber: #D98A2B;
    --amber-soft: #FCF1DE;
    --coral: #D65A5A;
    --coral-soft: #FBEBEB;
    --teal: #2C9C82;
    --teal-soft: #E6F5F0;
    --violet: #7C5CBF;
    --violet-soft: #EFE9F8;
    --card-bg: #FFFFFF;
    --border: #E4E0D4;
    --gray: #94A0AD;
    --gray-line: #CBD3DC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; color: var(--ink); }
  .wrap { max-width: 680px; margin: 0 auto; padding: 32px 20px 80px; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-soft); text-decoration: none; font-size: 0.88rem; font-weight: 600; margin-bottom: 18px; }
  .back-link:hover { color: var(--blue); }

  .hero { background: var(--ink); border-radius: 18px; padding: 26px 28px; color: #fff; margin-bottom: 22px; }
  .hero h1 { color: #fff; font-size: 1.7rem; margin: 0 0 6px; }
  .hero p { margin: 0; color: #C8D3E0; font-size: 0.96rem; max-width: 52ch; }

  .statline { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--text-soft); margin-bottom: 8px; }
  .statline b { color: var(--ink); }
  .progress-track { height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; margin-bottom: 20px; }
  .progress-fill { height: 100%; background: var(--blue); border-radius: 999px; transition: width 0.25s ease; }

  .qcard {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px;
    padding: 26px 28px; box-shadow: 0 4px 18px rgba(28,43,74,0.06);
  }
  .qkicker { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 0.72rem; letter-spacing: 0.03em; text-transform: uppercase; color: var(--blue); margin: 0 0 8px; }
  .qtext { font-size: 1.1rem; font-weight: 700; color: var(--ink); line-height: 1.35; margin: 0 0 16px; }
  .diagram-wrap { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 6px; margin-bottom: 18px; }
  .diagram-wrap svg { display: block; width: 100%; height: auto; }

  .opt {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left; font-family: 'Inter', sans-serif; font-size: 0.96rem; font-weight: 600;
    color: var(--ink); background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 12px;
    padding: 12px 16px; margin-bottom: 10px; cursor: pointer; transition: all 0.15s ease;
  }
  .opt:hover:not(.locked) { border-color: var(--blue); background: var(--blue-soft); }
  .opt .letter {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 999px; border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 700; color: var(--text-soft);
  }
  .opt.correct { border-color: var(--teal); background: var(--teal-soft); }
  .opt.correct .letter { background: var(--teal); border-color: var(--teal); color: #fff; }
  .opt.incorrect { border-color: var(--coral); background: var(--coral-soft); }
  .opt.incorrect .letter { background: var(--coral); border-color: var(--coral); color: #fff; }
  .opt.locked { cursor: default; }
  .opt.dim { opacity: 0.55; }

  .explain {
    display: none; margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: var(--blue-soft); color: var(--ink); font-size: 0.9rem; line-height: 1.45;
  }
  .explain.show { display: block; }
  .explain b { color: var(--blue); }

  .qcontrols { display: flex; justify-content: flex-end; margin-top: 18px; }
  .btn {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.92rem;
    border: 1px solid var(--ink); background: var(--ink); color: #fff;
    border-radius: 10px; padding: 11px 20px; cursor: pointer; transition: opacity 0.15s ease;
  }
  .btn:hover { opacity: 0.88; }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn.ghost { background: var(--card-bg); color: var(--ink); }

  /* results screen */
  .results { text-align: center; }
  .score-big { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 3rem; color: var(--ink); margin: 6px 0; }
  .score-msg { font-size: 1rem; color: var(--text-soft); margin-bottom: 22px; }
  .missed-list { text-align: left; margin: 20px 0; padding: 0; list-style: none; }
  .missed-list li { padding: 10px 0; border-top: 1px solid var(--border); font-size: 0.88rem; color: var(--text-soft); }
  .missed-list li b { color: var(--ink); display: block; margin-bottom: 2px; }

  @media (max-width: 480px) {
    .qtext { font-size: 1.02rem; }
  }
  .sec-picker{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
  .sec-picker button{font:600 0.8rem Inter,sans-serif;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text-soft);padding:7px 11px;border-radius:999px;cursor:pointer}
  .sec-picker button.active{background:var(--ink);border-color:var(--ink);color:#fff}
</style>

<script>
/* ---- shared diagram helpers (same small library as the flashcards page) ---- */
function svg(inner, vb, h) { return '<svg viewBox="'+vb+'" width="100%" height="'+(h||180)+'" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg>'; }
function lineEl(x1,y1,x2,y2,color,w,dash){ return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(color||'var(--ink)')+'" stroke-width="'+(w||2.5)+'" stroke-linecap="round"'+(dash?' stroke-dasharray="5 4"':'')+'/>'; }
function dot(x,y,color,r){ return '<circle cx="'+x+'" cy="'+y+'" r="'+(r||3.2)+'" fill="'+(color||'var(--ink)')+'"/>'; }
function txt(x,y,s,color,size,weight,anchor){ return '<text x="'+x+'" y="'+y+'" fill="'+(color||'var(--ink)')+'" font-family="Space Grotesk, sans-serif" font-size="'+(size||13)+'" font-weight="'+(weight||700)+'" text-anchor="'+(anchor||'middle')+'">'+s+'</text>'; }
function poly(pts,color,w,fill){ return '<polygon points="'+pts+'" fill="'+(fill||'none')+'" stroke="'+(color||'var(--ink)')+'" stroke-width="'+(w||2.5)+'" stroke-linejoin="round"/>'; }
function ellipseEl(cx,cy,rx,ry,fill,stroke,w){ return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'var(--ink)')+'" stroke-width="'+(w||2.5)+'"/>'; }
function circleEl(cx,cy,r,fill,stroke,w){ return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'var(--ink)')+'" stroke-width="'+(w||2.5)+'"/>'; }
function rectEl(x,y,w,h,rx,fill,stroke,sw){ return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(rx||0)+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'var(--ink)')+'" stroke-width="'+(sw||2.5)+'"/>'; }
function pathEl(d,stroke,w,fill,dash){ return '<path d="'+d+'" fill="'+(fill||'none')+'" stroke="'+(stroke||'var(--ink)')+'" stroke-width="'+(w||2.5)+'" stroke-linecap="round"'+(dash?' stroke-dasharray="4 3"':'')+'/>'; }
function wavy(x1,y1,x2,y2,amp,cycles,color,w){
  var n=28, pts=[];
  var dx=x2-x1, dy=y2-y1, len=Math.sqrt(dx*dx+dy*dy)||1;
  var ux=dx/len, uy=dy/len, px=-uy, py=ux;
  for(var i=0;i<=n;i++){
    var t=i/n;
    var bx=x1+dx*t, by=y1+dy*t;
    var off=Math.sin(t*Math.PI*2*cycles)*amp;
    pts.push((bx+px*off).toFixed(1)+','+(by+py*off).toFixed(1));
  }
  return '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+(color||'var(--ink)')+'" stroke-width="'+(w||2.2)+'" stroke-linecap="round"/>';
}

function diagProkaryoticCell(){
  var inner =

    + pathEl('M105,72 C105,58 122,54 132,63 C142,72 160,68 160,82 C160,96 142,100 132,91 C122,82 105,86 105,72 Z','var(--teal)',2.2)
    + txt(140,18,'Cell Wall','var(--ink)',10,700)
    + txt(140,131,'Cell Membrane','var(--blue)',9,600)
    + txt(133,113,'nucleoid (single DNA loop)','var(--teal)',7.8,600)
    + dot(55,45,'var(--ink)',2.2) + dot(70,92,'var(--ink)',2.2) + dot(188,50,'var(--ink)',2.2) + dot(198,96,'var(--ink)',2.2) + dot(60,66,'var(--ink)',2.2) + dot(208,76,'var(--ink)',2.2)
    + txt(58,32,'ribosomes','var(--text-soft)',7.5,600);
  return svg(inner,'0 0 320 145',150);
}

    + txt(95,188,'Step 1: engulfs an','var(--text-soft)',9,600)
    + txt(95,200,'α-proteobacterium','var(--text-soft)',9,600)

    + poly('218,105 232,112 218,119','var(--ink)',2,'var(--ink)')

    + ellipseEl(282,96,16,10,'var(--coral-soft)','var(--coral)',2)

/* ============ 2.3 Cell Membrane diagrams (original, same helper library) ============ */
function diagPhospholipid(){
  var inner =
      circleEl(80,50,30,'var(--blue-soft)','var(--blue)',2.5)
    + txt(80,46,'phosphate','var(--blue)',9,700)
    + txt(80,58,'+ glycerol','var(--blue)',9,700)
    + lineEl(68,80,68,178,'var(--ink)',3)
    + pathEl('M92,80 L92,118 L106,132 L106,178','var(--ink)',3)
    + txt(215,44,'Polar head','var(--blue)',12,700,'start') + txt(215,60,'hydrophilic (water-loving)','var(--text-soft)',10,600,'start')
    + lineEl(112,50,208,50,'var(--blue)',1.5,true)
    + txt(215,126,'Nonpolar tails','var(--ink)',12,700,'start') + txt(215,142,'2 fatty acids — hydrophobic','var(--text-soft)',10,600,'start')
    + lineEl(112,132,208,132,'var(--ink)',1.5,true)
    + txt(50,196,'saturated','var(--text-soft)',9,600) + txt(116,196,'unsaturated (kink)','var(--text-soft)',9,600);
  return svg(inner,'0 0 400 206',200);
}

function diagPhospholipidBilayer(){
  var xs=[30,72,114,156,198,240,282];
  var inner='';
  inner += rectEl(0,40,312,100,0,'var(--amber-soft)','none',0);
  for(var i=0;i<xs.length;i++){
    var x=xs[i];
    inner += circleEl(x,26,11,'var(--blue-soft)','var(--blue)',2);
    inner += lineEl(x-4,37,x-4,72,'var(--ink)',2.2) + lineEl(x+4,37,x+4,72,'var(--ink)',2.2);
    inner += lineEl(x-4,108,x-4,143,'var(--ink)',2.2) + lineEl(x+4,108,x+4,143,'var(--ink)',2.2);
    inner += circleEl(x,154,11,'var(--blue-soft)','var(--blue)',2);
  }
  inner += txt(156,10,'OUTSIDE (extracellular) — watery','var(--blue)',9.5,700);
  inner += txt(156,94,'hydrophobic core: tails face inward','var(--amber)',9.5,700);
  inner += txt(156,182,'INSIDE (cytoplasm) — watery','var(--blue)',9.5,700);
  return svg(inner,'0 0 312 190',170);
}

function diagMembraneParts(){
  var inner='', xs=[];
  for(var x=20;x<=400;x+=22) xs.push(x);
  inner += rectEl(0,70,420,60,0,'var(--amber-soft)','none',0);
  for(var i=0;i<xs.length;i++){
    var x=xs[i];
    if((x>100&&x<170)||(x>250&&x<300)) continue;
    inner += circleEl(x,62,8,'var(--blue-soft)','var(--blue)',1.6) + circleEl(x,138,8,'var(--blue-soft)','var(--blue)',1.6);
  }
  // integral, spans membrane
  inner += rectEl(106,36,58,128,22,'var(--coral-soft)','var(--coral)',2.5);
  inner += txt(135,186,'integral (spans)','var(--coral)',9.5,700);
  // integral, partway
  inner += rectEl(252,42,46,62,18,'var(--coral-soft)','var(--coral)',2.5);
  inner += txt(275,186,'integral (partway)','var(--coral)',9.5,700);
  // peripheral
  inner += ellipseEl(350,160,26,12,'var(--violet-soft)','var(--violet)',2.2);
  inner += txt(350,186,'peripheral','var(--violet)',9.5,700);
  // glycoprotein chain
  inner += pathEl('M135,36 L135,22 L125,12 M135,22 L147,12 M147,12 L155,4','var(--teal)',2.5);
  inner += txt(186,14,'carbohydrate chain','var(--teal)',9,700,'start');
  // cholesterol
  inner += rectEl(206,88,18,24,4,'var(--amber)','var(--amber)',1.5);
  inner += txt(215,160,'cholesterol','var(--amber)',9,700);
  inner += lineEl(215,114,215,150,'var(--amber)',1.2,true);
  inner += txt(30,20,'outside','var(--text-soft)',9,600,'start');
  return svg(inner,'0 0 420 196',190);
}

  return svg(inner,'0 0 420 206',205);
}

/* ============ 2.7–2.12 transport diagrams (original) ============ */
function diagTonicity(){
  function cell(cx,label,sub,rx,ry,arrowsIn,color){
    var s = rectEl(cx-62,30,124,120,10,'var(--blue-soft)','var(--blue)',1.5)

    'Equilibrium','Active transport','Concentration gradient','Cytolysis'
  ], correct:0, explain:'Once molecules are evenly spread, the system is at equilibrium. They still move, but with no net change.'},
  {sec:'2.7', kicker:'2.7 Simple Diffusion', text:'In simple diffusion, molecules move:', opts:[
    'From low concentration to high concentration','Only through channel proteins','Only when ATP is present','From high concentration to low concentration'
  ], correct:3, explain:'Diffusion runs down the concentration gradient, high → low, with no energy.'},
  {sec:'2.7', kicker:'2.7 Facilitated Diffusion', text:'Glucose enters a cell through a carrier protein, moving from high to low concentration. What kind of transport is this?', opts:[
    'Facilitated diffusion (passive)','Endocytosis','Primary active transport','Simple diffusion'
  ], correct:0, explain:'A protein is helping, but it\'s high → low with no energy, so it\'s facilitated diffusion, which is passive.'},
  {sec:'2.7', kicker:'2.7 Facilitated Diffusion', text:'An ion channel is closed. There is much more of the ion outside the cell than inside. What happens?', opts:[
    'Ions flow out.','The cell uses ATP to force it open.','Ions flow in anyway.','No ions flow through that channel until it opens.'
  ], correct:3, explain:'Gated channels can open and close. A closed channel lets nothing through, even with a gradient.'},
  {sec:'2.8', kicker:'2.7–2.8 Osmosis', text:'Osmosis is best described as:', opts:[
    'Movement of solutes from low to high concentration','Movement of water from where there\'s more water to where there\'s less water','Movement of water using ATP','A cell engulfing a large particle'
  ], correct:1, explain:'Osmosis is diffusion of water: more water → less water, no energy.'},
  {sec:'2.8', kicker:'2.8 Tonicity — Diagram', text:'In the middle panel, water leaves the cell and it shrinks. The solution around it is:', diagram:'tonicity', opts:[
    'Equilibrium','Isotonic','Hypertonic','Hypotonic'
  ], correct:2, explain:'Hyper = more solute outside, so water moves out toward the solute and the cell shrinks.'},
  {sec:'2.8', kicker:'2.8 Tonicity', text:'A cell\'s inside is 1% salt. It is placed in a 4% salt solution. Which way does water move? (original numbers)', opts:[
    'Water can\'t cross the membrane','Out of the cell','No net movement','Into the cell'
  ], correct:1, explain:'The solution has more solute, so it\'s hypertonic. Water moves toward the solute, out of the cell.'},
  {sec:'2.8', kicker:'2.8 Tonicity', text:'The same 1%-salt cell is placed in a 0.2% salt solution. What happens to an animal cell?', opts:[
    'It undergoes plasmolysis.','Water moves out; it shrivels.','Nothing changes.','Water moves in; it swells and may burst (cytolysis).'
  ], correct:3, explain:'Less solute outside = hypotonic. Water rushes in, and with no cell wall an animal cell can burst.'},
  {sec:'2.8', kicker:'2.8 Tonicity', text:'A plant cell in a hypotonic solution becomes:', opts:[
    'Shriveled','Turgid (firm against its cell wall)','Plasmolyzed','Burst (cytolysis)'
  ], correct:1, explain:'Water rushes in, but the cell wall stops it from bursting. The cell presses firmly against the wall, which is healthy for a plant.'},
  {sec:'2.8', kicker:'2.8 Tonicity', text:'A wilting plant cell\'s membrane has pulled away from its cell wall. This is:', opts:[
    'Turgor, caused by an isotonic environment','Endocytosis','Plasmolysis, caused by a hypertonic environment','Cytolysis, caused by a hypotonic environment'
  ], correct:2, explain:'In a hypertonic solution water leaves, and the membrane shrinks away from the wall. That\'s plasmolysis.'},
  {sec:'2.8', kicker:'2.8 Tonicity', text:'"Isotonic" means:', opts:[
    'Equal solute concentrations, so no net water movement','The cell has a cell wall','Less solute outside the cell','More solute outside the cell'
  ], correct:0, explain:'Iso = same. Water still moves both ways, but there\'s no net change and the cell stays the same size.'},
  {sec:'2.10', kicker:'2.10 SA:V — Diagram', text:'What is the surface area to volume ratio of a 4 cm cube? (SA = l × w × 6, V = l × w × h)', diagram:'cubes', opts:[
    '1:1','3:2','6:1','2:1'
  ], correct:1, explain:'SA = 4×4×6 = 96. V = 4×4×4 = 64. 96:64 simplifies to 3:2.'},
  {sec:'2.10', kicker:'2.10 SA:V', text:'As a cube (or cell) gets larger, its surface area to volume ratio:', opts:[
    'Becomes zero','Stays the same','Increases, because surface area grows faster','Decreases, because volume grows faster than surface area'
  ], correct:3, explain:'Both grow, but volume grows faster, so there\'s less membrane per amount of cell.'},
  {sec:'2.10', kicker:'2.10 SA:V', text:'Which cell can get rid of its wastes by diffusion most efficiently?', opts:[
    'A small cell, because it has a larger SA:V ratio','A large cell, because it has more surface area in total','They are all equally efficient','A large cell, because it has more volume'
  ], correct:0, explain:'More membrane relative to its inside means materials reach and leave the whole cell faster.'},
  {sec:'2.10', kicker:'2.10 Agar Cubes', text:'In the agar cube experiment, pink agar turns clear as acid diffuses in. After the same amount of time, which cube still has the most pink in its center?', opts:[
    'All cubes are equally pink','The smallest cube','The largest cube','None, since all cubes turn clear instantly'
  ], correct:2, explain:'Diffusion can\'t reach the center of a big cube as quickly. That\'s why cells stay small.'},
  {sec:'2.11', kicker:'2.11 Active Transport', text:'Which is a defining feature of active transport?', opts:[
    'It happens only through open channels.','It only moves water.','It moves substances from high to low with no energy.','It moves substances against the concentration gradient using ATP.'
  ], correct:3, explain:'Active = low → high (against the gradient), powered by ATP, usually by a carrier protein or pump.'},
  {sec:'2.11', kicker:'2.11 Symport & Antiport', text:'A transport protein moves one molecule into the cell while moving a different one out. It is a:', opts:[
    'Antiport','Vesicle','Symport','Channel protein'
  ], correct:0, explain:'Anti = opposite directions. Symport moves both the same way.'},
  {sec:'2.11', kicker:'2.11 Na⁺/K⁺ Pump — Diagram', text:'Each cycle, the Na⁺/K⁺ pump moves:', diagram:'nakpump', opts:[
    '3 Na⁺ out and 2 K⁺ in','2 Na⁺ out and 3 K⁺ in','3 Na⁺ in and 2 K⁺ out','1 Na⁺ out and 1 K⁺ in'
  ], correct:0, explain:'3 sodium out, 2 potassium in, using ATP. More positive charge goes out than in, so it\'s an electrogenic pump.'},
  {sec:'2.11', kicker:'2.11 Types of Active Transport', text:'The Na⁺/K⁺ pump is an example of:', opts:[
    'Facilitated diffusion','Primary active transport','Secondary active transport','Osmosis'
  ], correct:1, explain:'It uses ATP directly, which is what makes it primary.'},
  {sec:'2.11', kicker:'2.11 Types of Active Transport', text:'Which describes secondary active transport (cotransport)?', opts:[
    'It uses an existing electrochemical gradient, not ATP directly, to move a molecule against its gradient.','It moves molecules only from high to low.','It uses ATP directly to pump ions.','It moves water through aquaporins.'
  ], correct:0, explain:'Cotransport rides on a gradient (like sodium\'s) instead of spending ATP directly.'},
  {sec:'2.11', kicker:'2.11 Cotransport', text:'Why does a drink with salt AND glucose help patients losing fluids from severe diarrhea?', opts:[
    'Salt kills the bacteria causing it.','Glucose blocks the Na⁺/K⁺ pump.','It makes the gut hypertonic so water leaves the body.','Sodium–glucose cotransporters pull both in together, helping the gut absorb them (and water follows).'
  ], correct:3, explain:'The sodium–glucose symport moves both into intestine cells together. This is the medical use mentioned in the lecture.'},
  {sec:'2.11', kicker:'2.11 Bulk Transport — Diagram', text:'A cell releases proteins by fusing a vesicle from the Golgi with its membrane. This is:', diagram:'bulk', opts:[
    'Endocytosis','Facilitated diffusion','Osmosis','Exocytosis'
  ], correct:3, explain:'Exo = out. The vesicle fuses and releases its contents. Bulk transport requires energy.'},
  {sec:'2.11', kicker:'2.11 Bulk Transport', text:'Which is NOT one of the three types of endocytosis from the notes?', opts:[
    'Pinocytosis','Receptor-mediated endocytosis','Phagocytosis','Exocytosis'
  ], correct:3, explain:'Exocytosis is the opposite process (secreting). The three types of endocytosis are phagocytosis, pinocytosis, and receptor-mediated endocytosis.'},
  {sec:'2.11', kicker:'2.11–2.12 Bulk Transport', text:'After a cell takes in a large molecule by endocytosis, which organelle breaks it down?', opts:[
    'Cell wall','Nucleus','Lysosome','Ribosome'
  ], correct:2, explain:'Lysosomes break down large molecules using enzymes (from 2.2).'}
];
var Q = ALLQ.slice();

var idx = 0, score = 0, answered = false, missed = [];

function render(){
  var q = Q[idx];
  document.getElementById('qNum').textContent = idx+1;
  document.getElementById('qTotal').textContent = Q.length;
  document.getElementById('scoreLive').textContent = 'Score: '+score;
  document.getElementById('progressFill').style.width = Math.round((idx/Q.length)*100)+'%';
  document.getElementById('qKicker').textContent = q.kicker;
  document.getElementById('qText').textContent = q.text;

  var dWrap = document.getElementById('diagramWrap');
  if(q.diagram){ dWrap.style.display='block'; dWrap.innerHTML = diagramFor(q.diagram); }
  else { dWrap.style.display='none'; dWrap.innerHTML=''; }

  var optsWrap = document.getElementById('optsWrap');
  optsWrap.innerHTML='';
  var letters=['A','B','C','D'];
  q.opts.forEach(function(optText, i){
    var b = document.createElement('button');
    b.className='opt';
    b.innerHTML = '<span class="letter">'+letters[i]+'</span><span>'+optText+'</span>';
    b.addEventListener('click', function(){ selectAnswer(i); });
    optsWrap.appendChild(b);
  });

  document.getElementById('explain').classList.remove('show');
  document.getElementById('explain').textContent='';
  document.getElementById('btnNext').disabled = true;
  answered = false;
}

function selectAnswer(i){
  if(answered) return;
  answered = true;
  var q = Q[idx];
  var opts = document.querySelectorAll('.opt');
  opts.forEach(function(el,i2){
    el.classList.add('locked');
    if(i2===q.correct) el.classList.add('correct');
    else if(i2===i) el.classList.add('incorrect');
    else el.classList.add('dim');
  });
  if(i===q.correct){ score++; }
  else { missed.push(q); }
  document.getElementById('scoreLive').textContent = 'Score: '+score;
  var ex = document.getElementById('explain');
  ex.innerHTML = '<b>'+(i===q.correct?'Correct. ':'Not quite. ')+'</b>'+q.explain;
  ex.classList.add('show');
  document.getElementById('btnNext').disabled = false;
}

function nextQuestion(){
  if(idx < Q.length-1){ idx++; render(); }
  else { showResults(); }
}

function showResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  document.getElementById('finalScore').textContent = score+' / '+Q.length;
  var pct = Math.round((score/Q.length)*100);
  var msg;
  if(pct===100) msg = 'Perfect score — locked in.';
  else if(pct>=80) msg = 'Strong work. Review the missed ones below and you\'ve got it.';
  else if(pct>=60) msg = 'Good start — a few gaps to close. Check the missed questions below.';
  else msg = 'Worth another pass through the flashcards before the next round.';
  document.getElementById('finalMsg').textContent = msg+' ('+pct+'%)';

  var list = document.getElementById('missedList');
  list.innerHTML='';
  if(missed.length===0){
    var li=document.createElement('li'); li.textContent='No missed questions — nice.'; list.appendChild(li);
  } else {
    missed.forEach(function(q){
      var li=document.createElement('li');
      li.innerHTML = '<b>'+q.text+'</b>Correct answer: '+q.opts[q.correct];
      list.appendChild(li);
    });
  }
}

document.getElementById('btnNext').addEventListener('click', nextQuestion);
document.getElementById('btnRetake').addEventListener('click', function(){
  idx=0; score=0; missed=[]; answered=false;
  document.getElementById('resultsArea').style.display='none';
  document.getElementById('quizArea').style.display='block';
  render();
});

var SECS=[['all','All of Unit 2'],['2.1–2.2','2.1–2.2 Cells & Organelles'],['2.3','2.3 Cell Membrane'],['2.7','2.7 Passive Transport'],['2.8','2.8 Osmosis & Tonicity'],['2.10','2.10 Surface Area : Volume'],['2.11','2.11–2.12 Active Transport']];
function startSec(k){
  Q = k==='all' ? ALLQ.slice() : ALLQ.filter(function(x){return x.sec===k;});
  idx=0; score=0; missed=[]; answered=false;
  document.getElementById('resultsArea').style.display='none';
  document.getElementById('quizArea').style.display='block';
  var label=SECS.filter(function(s){return s[0]===k;})[0][1];
  document.getElementById('heroSub').textContent = Q.length+' questions · '+label+'. Pick a lesson below or take the whole unit.';
  Array.prototype.forEach.call(document.getElementById('secPicker').children,function(b){b.classList.toggle('active',b.dataset.k===k);});
  render();
}
(function(){ var p=document.getElementById('secPicker');
  SECS.forEach(function(s){ var b=document.createElement('button'); b.textContent=s[1]; b.dataset.k=s[0]; b.onclick=function(){startSec(s[0]);}; p.appendChild(b); });
})();
startSec('all');
</script>
